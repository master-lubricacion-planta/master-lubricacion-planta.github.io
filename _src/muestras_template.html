<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1c47">
<link rel="manifest" href="manifest.json">

<title>Toma de Muestras — Lubricación</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --line:#dde3ee; --ink:#101a33; --ink-2:#4a5776; --ink-3:#8391ad;
  --accent:#0c2a66; --accent-soft:#e4ebf8; --accent-ink:#0c2a66;
  --navy:#0b1c47; --navy-2:#12295e; --on-navy:#ffffff; --on-navy-2:#9db1d9;
  --orange:#f5822b; --orange-soft:#fdebd7; --orange-ink:#9c5a12;
  --ok:#1d7a4f; --ok-bg:#dff1e7; --bad:#b3261e; --bad-bg:#f9e0de; --na:#5f6b85; --na-bg:#e7ebf3;
  --tA:#0c5c8a; --tA-bg:#ddeefa; --tB:#6d28a8; --tB-bg:#efe3fa;
  --shadow:0 1px 3px rgba(11,28,71,.08),0 6px 18px rgba(11,28,71,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1128; --surface:#111c3d; --line:#243459; --ink:#e8edf8; --ink-2:#a3b1d0; --ink-3:#6d7c9e;
    --accent:#7da4e8; --accent-soft:#1a2c5c; --accent-ink:#aec8f5;
    --navy:#060d24; --navy-2:#0d1a40; --on-navy:#ffffff; --on-navy-2:#8fa5d4;
    --orange:#f5822b; --orange-soft:#3d2a12; --orange-ink:#f0b070;
    --ok:#57c093; --ok-bg:#173628; --bad:#f2998f; --bad-bg:#42201d; --na:#9daac6; --na-bg:#1c2749;
    --tA:#7bc4f0; --tA-bg:#0e2c40; --tB:#c9a2ee; --tB-bg:#2b1840;
    --shadow:0 1px 3px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1128; --surface:#111c3d; --line:#243459; --ink:#e8edf8; --ink-2:#a3b1d0; --ink-3:#6d7c9e;
  --accent:#7da4e8; --accent-soft:#1a2c5c; --accent-ink:#aec8f5;
  --navy:#060d24; --navy-2:#0d1a40; --on-navy:#ffffff; --on-navy-2:#8fa5d4;
  --orange:#f5822b; --orange-soft:#3d2a12; --orange-ink:#f0b070;
  --ok:#57c093; --ok-bg:#173628; --bad:#f2998f; --bad-bg:#42201d; --na:#9daac6; --na-bg:#1c2749;
  --tA:#7bc4f0; --tA-bg:#0e2c40; --tB:#c9a2ee; --tB-bg:#2b1840;
  --shadow:0 1px 3px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#f4f6fa; --surface:#ffffff; --line:#dde3ee; --ink:#101a33; --ink-2:#4a5776; --ink-3:#8391ad;
  --accent:#0c2a66; --accent-soft:#e4ebf8; --accent-ink:#0c2a66;
  --navy:#0b1c47; --navy-2:#12295e; --on-navy:#ffffff; --on-navy-2:#9db1d9;
  --orange:#f5822b; --orange-soft:#fdebd7; --orange-ink:#9c5a12;
  --ok:#1d7a4f; --ok-bg:#dff1e7; --bad:#b3261e; --bad-bg:#f9e0de; --na:#5f6b85; --na-bg:#e7ebf3;
  --tA:#0c5c8a; --tA-bg:#ddeefa; --tB:#6d28a8; --tB-bg:#efe3fa;
  --shadow:0 1px 3px rgba(11,28,71,.08),0 6px 18px rgba(11,28,71,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
button{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:10;background:linear-gradient(100deg,var(--navy),var(--navy-2));padding:12px 14px 0;border-bottom:3px solid var(--orange)}
.brand{display:flex;align-items:center;gap:10px;max-width:920px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex:0 0 auto;text-decoration:none}
.logo svg{width:22px;height:22px;fill:#fff}
.brand h1{font-size:17px;font-weight:800;margin:0;color:var(--on-navy)}
.brand .sub{display:block;font-size:10.5px;font-weight:600;color:var(--on-navy-2);text-transform:uppercase;letter-spacing:.1em}
.brandright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tecklogo{height:24px;width:auto;display:block}
.adminline{font-size:9.5px;font-weight:600;color:var(--on-navy-2);letter-spacing:.05em;white-space:nowrap}
.tabs{display:flex;align-items:center;gap:10px;max-width:920px;margin:10px auto 0;flex-wrap:wrap}
.tabs a{color:var(--on-navy-2);text-decoration:none;font-size:14px;font-weight:700;padding:8px 2px 10px;border-bottom:3px solid transparent;margin-bottom:-3px}
.tabs a svg{width:14px;height:14px;fill:currentColor;vertical-align:-2px;margin-right:4px}
.tabs a.on{color:var(--on-navy);border-bottom-color:var(--orange)}
.tabs .slash{color:var(--on-navy-2);font-weight:300;font-size:17px}
#back{margin-left:auto;margin-bottom:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:var(--on-navy);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;cursor:pointer;display:none}

main{padding:14px;max-width:920px;margin:0 auto}
.dayhdr{font-size:19px;font-weight:800;margin:4px 2px 2px}
.daysub{font-size:13px;color:var(--ink-2);margin:0 2px 14px}
.hint{color:var(--ink-2);text-align:center;padding:40px 20px;font-size:15px}
.offlinetag{font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-bg);display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;margin-bottom:10px}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.wcard .wn{font-weight:800;font-size:15px}
.wcard .wd{font-size:11px;color:var(--ink-3);margin-top:2px}
.wcard.now{border:2px solid var(--orange)}
.wcard.now .wn::after{content:' · ACTUAL';color:var(--orange);font-size:10px;letter-spacing:.05em}
.wpct{font-size:11px;font-weight:800;margin-top:6px;color:var(--ink-2)}
.mbar{height:6px;border-radius:999px;background:var(--na-bg);margin-top:6px;overflow:hidden}
.mbar>i{display:block;height:100%;border-radius:999px;background:var(--ok)}

.kpis{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow)}
.kpi .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.re .v{color:var(--orange-ink)}

/* dashboard por area */
.dash{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.dash h3{margin:0 0 10px;font-size:14.5px}
.abar{display:flex;align-items:center;gap:10px;margin-bottom:7px;cursor:pointer}
.abar .an{width:172px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abar .atrack{flex:1;height:14px;border-radius:999px;background:var(--na-bg);overflow:hidden}
.abar .atrack>i{display:block;height:100%;border-radius:999px}
.abar .av{width:104px;text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.abar .av .falt{color:var(--bad)}
.abar .av .full{color:var(--ok)}

.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.fchip.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:800;font-size:14.5px;flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .flecha{transition:transform .15s;color:var(--ink-3);font-size:12px}
details.sec[open]>summary .flecha{transform:rotate(90deg)}
details.sec>summary .badge{margin-left:auto}
.ring{font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px;white-space:nowrap}
.ring.p0{background:var(--na-bg);color:var(--na)}
.ring.part{background:var(--orange-soft);color:var(--orange-ink)}
.ring.done{background:var(--ok-bg);color:var(--ok)}

.item{padding:11px 14px;border-top:1px solid var(--line)}
.item .il{font-size:14px;font-weight:700}
.item .il .tag{font-family:ui-monospace,Consolas,monospace}
.item .il .eqn{color:var(--ink-2);font-weight:600}
.item .il .lubn{font-size:11.5px;color:var(--ink-3);font-weight:600}
.item .prevmark{font-size:11px;color:var(--ink-3);margin-left:6px}
.controles{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.echip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:800;cursor:pointer}
.echip.R.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.echip.NT.on{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.controles select{padding:8px 6px;font-size:13px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.controles input.irep{width:118px;padding:8px 9px;font-size:14px;font-weight:700;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.est-Normal{color:var(--ok)} .est-Precaucion,.est-Precaución{color:var(--orange-ink)} .est-Anormal{color:var(--orange-ink)} .est-Severo{color:var(--bad)}

.btnbar{display:flex;gap:8px;margin:14px 0 30px}
.btn{flex:1;padding:13px;border-radius:11px;border:0;font-weight:800;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0a1128}
.savemsg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.savemsg.show{opacity:.95}
.fab-save{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:40;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 30px;font-weight:800;font-size:15.5px;box-shadow:0 8px 24px rgba(11,28,71,.4);cursor:pointer;align-items:center;gap:9px}
.fab-save.show{display:flex}
:root[data-theme="dark"] .fab-save{color:#0a1128}
.fab-save.saved{background:var(--ok)}
.fabspacer{height:78px}
footer{padding:8px 14px 28px;text-align:center;font-size:11.5px;color:var(--ink-3)}

.plwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:6px}
table.pl{border-collapse:collapse;width:100%;font-size:11.5px;min-width:640px}
.pl th,.pl td{border:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap}
.pl th{background:var(--accent-soft);color:var(--accent-ink);font-size:11px}
.pl tr.sech td{background:var(--navy);color:#fff;font-weight:800;font-size:11px}
.pl .est-R{color:var(--ok);font-weight:800}
.pl .est-NT{color:var(--bad);font-weight:800}
@media print{
  header,footer,.noprint,#listado,#form{display:none!important}
  body{background:#fff;color:#000}
  main{max-width:100%;padding:0}
  .plwrap{border:0;box-shadow:none;overflow:visible}
  table.pl{font-size:9px;min-width:0}
  .pl th,.pl td{border-color:#999;padding:2px 4px}
  .pl tr.sech td{background:#e8ecf5!important;color:#000!important;-webkit-print-color-adjust:exact}
}

/* barra de navegación visible (pedido: el Volver del encabezado era muy camuflado) */
.navvolver{display:flex;gap:8px;margin:2px 0 14px;flex-wrap:wrap}
.bvolver{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.bvolver.cal{background:var(--accent-soft)}
.bvolver svg{width:15px;height:15px;fill:currentColor}
</style>
</head>

<script>
const ITEMS = __MUITEMS__;   /* [{n, area, tag, eq, lub}] — 317 puntos de muestreo mensuales */
const PREV  = __MUPREV__;    /* historial digitado en la planilla, por mes 1..12 */
const AREA_NAMES={"210":"Chancado primario","220":"Correas mineral grueso","240":"Recup. mineral grueso","310":"Molienda","320":"Chancado pebbles","330":"Flotación y remolienda","340":"Espesamiento concentrado","370":"Planta molibdeno","390":"Reactivos y floculante","410":"Espesamiento relaves","600":"GEHO y gabbionetas","900":"Servicios planta","920":"Agua de refrigeración","1400":"Manejo de relaves (WRS)"};
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS=['J','V','S','D','L','M','Mi'];
const RC=['Relleno','Cambio','No'];
const ESTADOS=['Normal','Precaución','Anormal','Severo'];

const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const MES_ACTUAL=Math.min(12,Math.max(1,(new Date().getFullYear()===2026)?(new Date().getMonth()+1):8));

const K=m=>'mu_'+m;
const load=m=>{ try{return JSON.parse(localStorage.getItem(K(m)))||{}}catch(e){return {}} };

const firebaseConfig = {
  apiKey: "AIzaSyANENea2R3eQHZufJipvEWIkMKwVvqJeVs",
  authDomain: "lubricacion-teck-qb.firebaseapp.com",
  projectId: "lubricacion-teck-qb",
  storageBucket: "lubricacion-teck-qb.firebasestorage.app",
  messagingSenderId: "697204585611",
  appId: "1:697204585611:web:824c3cf28291bdf1ec108e"
};
let cloudDb=null, cloudOk=false;
try{
  firebase.initializeApp(firebaseConfig);
  cloudDb=firebase.firestore();
  try{ cloudDb.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  cloudOk=true;
}catch(e){ cloudOk=false; }
function syncCloud(m,vals){
  if(!cloudOk) return;
  try{
    cloudDb.collection('pautas').doc('MU-2026-'+String(m).padStart(2,'0')).set({mu:true, mes:m, vals:vals||{}, updatedAt:new Date().toISOString()},{merge:true}).catch(()=>{});
  }catch(e){}
}
const save=(m,vals)=>{ localStorage.setItem(K(m),JSON.stringify(vals)); syncCloud(m,vals); flash(); };
let flashT; function flash(msg){ const el=$('#savemsg'); el.textContent=msg||'✓ Guardado'; el.classList.add('show'); clearTimeout(flashT); flashT=setTimeout(()=>el.classList.remove('show'),1100); }
async function syncFromCloudIfNeeded(m){
  if(!cloudOk) return;
  if(Object.keys(load(m)).length) return;
  try{
    const snap=await cloudDb.collection('pautas').doc('MU-2026-'+String(m).padStart(2,'0')).get();
    if(!snap.exists) return;
    const c=snap.data();
    if(c.vals && Object.keys(c.vals).length) localStorage.setItem(K(m),JSON.stringify(c.vals));
  }catch(e){}
}

function efectivo(m,n){
  const loc=load(m)[n];
  if(loc) return loc;
  return (PREV[String(m)]||{})[String(n)]||null;
}
function statsMes(m){
  let r=0,nt=0,sin=0;
  for(const it of ITEMS){ const v=efectivo(m,it.n);
    if(v&&v.m==='R')r++; else if(v&&v.m==='NT')nt++; else sin++;
  }
  return {r,nt,sin};
}
function statsArea(m){
  const res={};
  for(const it of ITEMS){
    const a=res[it.area]=res[it.area]||{tot:0,r:0,nt:0};
    a.tot++;
    const v=efectivo(m,it.n);
    if(v&&v.m==='R')a.r++; else if(v&&v.m==='NT')a.nt++;
  }
  return res;
}

let view={name:'meses'};
function barraVolver(){
  if(view.name==='meses') return;
  const cont=[...document.querySelectorAll('#listado,#form,#resumen,#planilla')].find(e=>e&&e.innerHTML.trim());
  if(!cont) return;
  const nivel1=(view.name==='mes');
  const div=document.createElement('div');
  div.className='navvolver noprint';
  div.innerHTML=(nivel1?'':'<button class="bvolver" id="bvolver">‹ Volver</button>')+
    '<button class="bvolver cal" id="bcal"><svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h4v18H3V4h4zm12 8H5v10h14zM5 8h14V6H5z"/></svg>Volver al calendario</button>';
  cont.prepend(div);
  const bv=div.querySelector('#bvolver'); if(bv) bv.onclick=goBack;
  div.querySelector('#bcal').onclick=()=>{ view={name:'meses'}; render(); };
}
function goBack(){
  if(view.name==='resumen') view={name:'mes',mes:view.mes};
  else if(view.name==='mes') view={name:'meses'};
  render();
}
$('#back').onclick=goBack;

function render(){
  $('#listado').innerHTML=''; $('#form').innerHTML=''; $('#resumen').innerHTML='';
  $('#fabsave').classList.remove('show');
  $('#back').style.display = view.name==='meses' ? 'none':'inline-block';
  if(view.name==='meses') renderMeses();
  else if(view.name==='mes') renderMes();
  else renderResumen();
  barraVolver();
  window.scrollTo(0,0);
}

function renderMeses(){
  let cards='';
  for(let m=1;m<=12;m++){
    const st=statsMes(m);
    const pct=Math.round(100*st.r/ITEMS.length);
    const det=st.r? st.r+' / '+ITEMS.length+' tomadas' : 'Sin registros';
    const extra=st.r? (st.nt? st.nt+' NT · '+st.sin+' sin registro' : st.sin+' sin registro') : '';
    cards+=`<button class="wcard ${m===MES_ACTUAL?'now':''}" data-m="${m}">
      <div class="wn">${MESES[m-1]}</div>
      <div class="wd">${det}</div>
      <div class="wpct" style="color:${st.r?(pct>=90?'var(--ok)':(pct>=70?'var(--orange-ink)':'var(--bad)')):'var(--ink-3)'}">${st.r?pct+'% cumplimiento':'—'}</div>
      <div class="mbar"><i style="width:${pct}%;background:${pct>=90?'var(--ok)':(pct>=70?'var(--orange)':'var(--bad)')}"></i></div>
      ${extra?`<div class="wd" style="margin-top:4px">${extra}</div>`:''}
    </button>`;
  }
  /* resumen del año: solo meses con registros */
  let acR=0, acMeses=0;
  for(let m2=1;m2<=12;m2++){ const s2=statsMes(m2); if(s2.r){ acR+=s2.r; acMeses++; } }
  const promedio=acMeses?Math.round(100*acR/(acMeses*ITEMS.length)):0;
  $('#listado').innerHTML=`
    <div class="dayhdr">Toma de muestras · Programa 2026</div>
    <p class="daysub"><b>${ITEMS.length} muestras de aceite mensuales</b> del programa de la Concentradora. Elige el mes para ver sus registros y completar la toma — estás en <b>${MESES[MES_ACTUAL-1]}</b>.</p>
    <div class="kpis">
      <div class="kpi ok"><div class="v">${promedio}%</div><div class="l">Cumplimiento año (${acMeses} meses)</div></div>
      <div class="kpi"><div class="v">${acR.toLocaleString('es-CL')}</div><div class="l">Muestras tomadas 2026</div></div>
      <div class="kpi"><div class="v">${(acMeses*ITEMS.length).toLocaleString('es-CL')}</div><div class="l">Programadas (${acMeses} meses)</div></div>
    </div>
    <div class="wgrid">${cards}</div>`;
  document.querySelectorAll('.wcard').forEach(b=>b.onclick=()=>{ view={name:'mes',mes:+b.dataset.m}; render(); });
}

let filtro='todas';
function renderMes(){
  const m=view.mes, st=statsMes(m), sa=statsArea(m);
  const pct=Math.round(100*st.r/ITEMS.length);
  /* dashboard: áreas ordenadas por muestras faltantes (sin R) */
  const orden=Object.keys(sa).sort((a,b)=>(sa[b].tot-sa[b].r)-(sa[a].tot-sa[a].r));
  let barras='';
  for(const a of orden){
    const s=sa[a]; const p=Math.round(100*s.r/s.tot); const falt=s.tot-s.r;
    const color=p>=100?'var(--ok)':(p>=70?'var(--orange)':'var(--bad)');
    barras+=`<div class="abar" data-a="${a}">
      <span class="an">${esc(AREA_NAMES[a]||('Área '+a))}</span>
      <span class="atrack"><i style="width:${p}%;background:${color}"></i></span>
      <span class="av">${s.r}/${s.tot} ${falt?`<span class="falt">−${falt}</span>`:'<span class="full">✓</span>'}</span>
    </div>`;
  }
  const areas={};
  for(const it of ITEMS) (areas[it.area]=areas[it.area]||[]).push(it);
  const vals=load(m);
  let secs='';
  for(const a of Object.keys(areas)){
    let filas=''; let visibles=0;
    const s=sa[a];
    for(const it of areas[a]){
      const v=efectivo(m,it.n)||{};
      if(filtro==='pend' && v.m==='R') continue;
      if(filtro==='hechas' && v.m!=='R') continue;
      visibles++;
      const esPrev=!vals[it.n] && (PREV[String(m)]||{})[String(it.n)];
      const optsD=['<option value="">día</option>'].concat(DIAS.map((d,i)=>`<option value="${i}" ${v.d===i?'selected':''}>${d}</option>`)).join('');
      const optsRC=['<option value="">relleno…</option>'].concat(RC.map(x=>`<option ${v.rc===x?'selected':''}>${x}</option>`)).join('');
      const optsE=['<option value="">estado…</option>'].concat(ESTADOS.map(x=>`<option ${v.est===x?'selected':''}>${x}</option>`)).join('');
      filas+=`<div class="item" data-n="${it.n}">
        <div class="il"><span class="tag">${esc(it.tag)}</span> <span class="eqn">· ${esc(it.eq)}</span>${it.lub?` <span class="lubn">· ${esc(it.lub)}</span>`:''}${esPrev?'<span class="prevmark">(planilla)</span>':''}</div>
        <div class="controles">
          <button class="echip R ${v.m==='R'?'on':''}" data-e="R">R</button>
          <button class="echip NT ${v.m==='NT'?'on':''}" data-e="NT">NT</button>
          <select class="idia" aria-label="Día">${optsD}</select>
          <select class="irc" aria-label="Relleno o cambio">${optsRC}</select>
          <input class="irep mono" inputmode="numeric" placeholder="N° reporte" value="${esc(v.rep||'')}">
          <select class="iest est-${esc(v.est||'')}" aria-label="Estado análisis">${optsE}</select>
        </div>
      </div>`;
    }
    if(!visibles) continue;
    secs+=`<details class="sec" id="sec-${a}" ${filtro!=='todas'?'open':''}>
      <summary><span class="flecha">▶</span> ${esc(AREA_NAMES[a]||('Área '+a))} <span style="color:var(--ink-3);font-weight:600">· ${a}</span><span class="badge ring ${s.r===0?'p0':(s.r>=s.tot?'done':'part')}">${s.r}/${s.tot}</span></summary>
      ${filas}
    </details>`;
  }
  $('#form').innerHTML=`
    <div class="dayhdr">${MESES[m-1]} 2026 · Toma de muestras</div>
    <p class="daysub">R = muestra tomada · NT = no tomada · con día, relleno/cambio, n° reporte ALS y estado del análisis. Lo que venía de la planilla aparece marcado <span class="prevmark">(planilla)</span>.</p>
    <div class="offlinetag">📴 Funciona sin internet — se guarda en este dispositivo y se sincroniza solo</div>
    <div class="kpis">
      <div class="kpi ok"><div class="v">${st.r} / ${ITEMS.length}</div><div class="l">Tomadas (R)</div></div>
      <div class="kpi ok"><div class="v">${pct}%</div><div class="l">Cumplimiento</div></div>
      <div class="kpi bad"><div class="v">${st.nt}</div><div class="l">No tomadas (NT)</div></div>
      <div class="kpi"><div class="v">${st.sin}</div><div class="l">Sin registro</div></div>
    </div>
    <div class="dash">
      <h3>¿Dónde faltan muestras? — por área, ordenado por faltantes</h3>
      ${barras}
    </div>
    <div class="filtros">
      <button class="fchip ${filtro==='todas'?'on':''}" data-f="todas">Todas</button>
      <button class="fchip ${filtro==='pend'?'on':''}" data-f="pend">Faltantes (sin R)</button>
      <button class="fchip ${filtro==='hechas'?'on':''}" data-f="hechas">Tomadas</button>
      <button class="fchip" id="verres">📋 Resumen / imprimir</button>
    </div>
    ${secs||'<div class="hint">Nada que mostrar con este filtro.</div>'}
    <div class="fabspacer"></div>`;

  document.querySelectorAll('.fchip[data-f]').forEach(b=>b.onclick=()=>{ filtro=b.dataset.f; render(); });
  $('#verres').onclick=()=>{ view={name:'resumen',mes:m}; render(); };
  document.querySelectorAll('.abar').forEach(b=>b.onclick=()=>{
    const sec=document.querySelector('#sec-'+b.dataset.a);
    if(sec){ sec.open=true; sec.scrollIntoView({behavior:'smooth',block:'start'}); }
  });

  function setVal(n,mut){
    const cur=load(m);
    const base=cur[n]||Object.assign({},efectivo(m,n)||{});
    mut(base);
    cur[n]=base;
    save(m,cur);
  }
  document.querySelectorAll('.item').forEach(el=>{
    const n=el.dataset.n;
    el.querySelectorAll('.echip').forEach(ch=>ch.onclick=()=>{
      const ya=ch.classList.contains('on');
      setVal(n,b=>{ b.m=ya?'':ch.dataset.e; });
      el.querySelectorAll('.echip').forEach(c2=>c2.classList.toggle('on', !ya && c2===ch));
      refrescar();
    });
    el.querySelector('.idia').addEventListener('change',e=>{ setVal(n,b=>{ b.d=e.target.value===''?null:+e.target.value; }); });
    el.querySelector('.irc').addEventListener('change',e=>{ setVal(n,b=>{ b.rc=e.target.value; }); });
    el.querySelector('.irep').addEventListener('change',e=>{ setVal(n,b=>{ b.rep=e.target.value.trim(); }); });
    el.querySelector('.iest').addEventListener('change',e=>{ setVal(n,b=>{ b.est=e.target.value; }); });
  });
  function refrescar(){
    const s=statsMes(m);
    const ks=document.querySelectorAll('.kpi .v');
    if(ks.length>=4){ ks[0].textContent=s.r+' / '+ITEMS.length; ks[1].textContent=Math.round(100*s.r/ITEMS.length)+'%'; ks[2].textContent=s.nt; ks[3].textContent=s.sin; }
  }

  const fab=$('#fabsave'); fab.classList.add('show');
  fab.onclick=()=>{ save(m,load(m)); fab.classList.add('saved'); fab.querySelector('.fabtxt').textContent='✓ Guardado'; setTimeout(()=>{fab.classList.remove('saved'); fab.querySelector('.fabtxt').textContent='Guardar mes';},1500); };

  syncFromCloudIfNeeded(m).then(()=>{ if(view.name==='mes'&&view.mes===m&&Object.keys(load(m)).length&&!Object.keys(vals).length) render(); });
}

function renderResumen(){
  const m=view.mes, st=statsMes(m);
  const areas={};
  for(const it of ITEMS) (areas[it.area]=areas[it.area]||[]).push(it);
  let filas='';
  for(const a of Object.keys(areas)){
    const conreg=areas[a].map(it=>[it,efectivo(m,it.n)]).filter(x=>x[1]&&(x[1].m||x[1].rep||x[1].est));
    if(!conreg.length) continue;
    filas+=`<tr class="sech"><td colspan="6">${esc(AREA_NAMES[a]||('Área '+a))} · ${a}</td></tr>`;
    for(const [it,v] of conreg){
      filas+=`<tr>
        <td class="mono">${esc(it.tag)}</td><td>${esc(it.eq)}</td>
        <td class="est-${esc(v.m||'')}">${esc(v.m||'—')}</td>
        <td>${esc(v.rc||'')}</td>
        <td class="mono">${esc(v.rep||'')}</td>
        <td class="est-${esc(v.est||'')}">${esc(v.est||'')}</td>
      </tr>`;
    }
  }
  $('#resumen').innerHTML=`
    <div class="dayhdr">📋 Resumen ${MESES[m-1]} 2026 · Toma de muestras</div>
    <p class="daysub">${st.r}/${ITEMS.length} tomadas — cumplimiento ${Math.round(100*st.r/ITEMS.length)}% · ${st.nt} no tomadas · ${st.sin} sin registro — vista para revisar, imprimir o traspasar a la planilla Excel.</p>
    <div class="btnbar noprint"><button class="btn primary" id="pimp">🖨 Imprimir / PDF</button></div>
    <div class="plwrap"><table class="pl">
      <tr><th>TAG</th><th>Equipo</th><th>R/NT</th><th>Relleno</th><th>N° reporte</th><th>Estado</th></tr>
      ${filas||'<tr><td colspan="6" style="text-align:center;color:var(--ink-3)">Sin registros este mes</td></tr>'}
    </table></div>
    <div style="height:30px"></div>`;
  $('#pimp').onclick=()=>window.print();
}

render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js')); }
</script>
</body>
</html>
