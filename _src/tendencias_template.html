<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1c47">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Tendencias — Análisis de Aceite</title>
<style>
/* Encabezado de la app (variables propias, no chocan con las del dashboard) */
:root{--navy:#0b1c47;--navy-2:#12295e;--on-navy:#ffffff;--on-navy-2:#9db1d9;--orange:#f5822b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--navy:#060d24;--navy-2:#0d1a40;--on-navy:#ffffff;--on-navy-2:#8fa5d4}}
:root[data-theme="dark"]{--navy:#060d24;--navy-2:#0d1a40;--on-navy:#ffffff;--on-navy-2:#8fa5d4}
header.appnav{position:sticky;top:0;z-index:10;background:linear-gradient(100deg,var(--navy),var(--navy-2));padding:12px 14px 0;border-bottom:3px solid var(--orange)}
.appnav .brand{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
.appnav .logo{width:34px;height:34px;border-radius:10px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex:0 0 auto;text-decoration:none}
.appnav .logo svg{width:22px;height:22px;fill:#fff}
.appnav h1{font-size:17px;font-weight:800;margin:0;color:var(--on-navy);font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
.appnav .sub{display:block;font-size:10.5px;font-weight:600;color:var(--on-navy-2);text-transform:uppercase;letter-spacing:.1em}
.appnav .brandright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.appnav .tecklogo{height:24px;width:auto;display:block}
.appnav .adminline{font-size:9.5px;font-weight:600;color:var(--on-navy-2);letter-spacing:.05em;white-space:nowrap}
.appnav .tabs{display:flex;align-items:center;gap:10px;max-width:1180px;margin:10px auto 0;flex-wrap:wrap;font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
.appnav .tabs a{color:var(--on-navy-2);text-decoration:none;font-size:14px;font-weight:700;padding:8px 2px 10px;border-bottom:3px solid transparent;margin-bottom:-3px}
.appnav .tabs a.on{color:var(--on-navy);border-bottom-color:var(--orange)}
.appnav .tabs .slash{color:var(--on-navy-2);font-weight:300;font-size:17px}
.appnav .tabs a svg{width:14px;height:14px;fill:currentColor;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>
<header class="appnav">
  <div class="brand">
    <a class="logo" href="index.html" aria-label="Ir al buscador"><svg viewBox="0 0 24 24"><path d="M12 2C12 2 5.5 9.2 5.5 14a6.5 6.5 0 0 0 13 0C18.5 9.2 12 2 12 2zm0 17.5a3.5 3.5 0 0 1-3.5-3.5c0-.4.33-.75.75-.75s.75.34.75.75a2 2 0 0 0 2 2c.41 0 .75.34.75.75s-.34.75-.75.75z"/></svg></a>
    <span><h1>Maestro de Lubricación</h1><span class="sub">Concentradora</span></span>
    <span class="brandright">
      <img class="tecklogo" src="__TECKLOGO__" alt="Teck">
      <span class="adminline">Admin: Nicolás Saravia</span>
    </span>
  </div>
  <nav class="tabs">
    <a href="index.html"><svg viewBox="0 0 24 24"><path d="M12 2C12 2 5.5 9.2 5.5 14a6.5 6.5 0 0 0 13 0C18.5 9.2 12 2 12 2z"/></svg>Maestro de Lubricación</a>
    <span class="slash">/</span>
    <a href="pautas.html"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zm8 1.5V8h4.5zM8.5 12h7v1.6h-7zm0 3.6h7v1.6h-7z"/></svg>Pautas Plan Semanal</a>
    <span class="slash">/</span>
    <a href="ruta.html"><svg viewBox="0 0 24 24"><path d="M10 4a2 2 0 0 1 4 0v9.3a4.7 4.7 0 1 1-4 0zm2 14.8a2.3 2.3 0 0 0 1-4.4V5h-2v9.4a2.3 2.3 0 0 0 1 4.4z"/></svg>Ruta Crítica</a>
    <span class="slash">/</span>
    <a class="on" href="tendencias.html"><svg viewBox="0 0 24 24"><path d="M3 3h2v16h16v2H3zm4.6 11.9-1.2-1.6 5-6.6 3.9 3.9 4.3-5.9 1.6 1.2-5.7 7.8-4-4z"/></svg>Tendencias</a>
  </nav>
</header>
__TENDENCIAS_BODY__
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js')); }
</script>
</body>
</html>
