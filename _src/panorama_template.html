*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
button{font:inherit;color:inherit}

.tabs a{color:var(--on-navy-2);text-decoration:none;font-size:14px;font-weight:700;padding:8px 2px 10px;border-bottom:3px solid transparent;margin-bottom:-3px}
.tabs a.on{color:var(--on-navy);border-bottom-color:var(--orange)}

#back{margin-left:auto;margin-bottom:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:var(--on-navy);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;cursor:pointer;display:none}

main{padding:14px;max-width:820px;margin:0 auto}
.dayhdr{font-size:19px;font-weight:800;margin:4px 2px 2px}

.livepill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--live);background:var(--live-bg);padding:4px 11px;border-radius:999px;margin-bottom:12px}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.wcard .wn{font-weight:800;font-size:15px}
.wcard .wd{font-size:11px;color:var(--ink-3);margin-top:2px}
.wcard .wt{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;margin-top:6px;letter-spacing:.04em}
.wcard .wt.A{background:var(--tA-bg);color:var(--tA)}
.wcard .wt.B{background:var(--tB-bg);color:var(--tB)}
.wcard.now{border:2px solid var(--orange)}
.wcard.now .wn::after{content:' · ACTUAL';color:var(--orange);font-size:10px;letter-spacing:.05em}
.wcard.nodata{opacity:.55}

.summ{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.summ .s{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}

.summ .s span{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.summ .s.done b{color:var(--ok)}
.summ .s.part b{color:var(--orange-ink)}
.summ .s.p0 b{color:var(--na)}
.summ .s.sind b{color:var(--ink-3)}

.dcard .df{color:var(--ink-3);font-size:13px}
.dcard .dc{margin-left:auto;font-size:12px;color:var(--ink-2);text-align:right;display:flex;gap:6px}
.mini{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}

.mini.part{background:var(--orange-soft);color:var(--orange-ink)}

.act .val{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px}
.act .est{font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:999px}
.act .est.B{background:var(--ok-bg);color:var(--ok)}
.act .est.M{background:var(--bad-bg);color:var(--bad)}
.act .est.NA{background:var(--na-bg);color:var(--na)}
.act .est.none{background:var(--na-bg);color:var(--ink-3)}
.act .obs{font-size:13px;color:var(--ink-2);margin-top:6px;font-style:italic}
.obsgbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;margin-top:6px}

footer{padding:8px 14px 28px;text-align:center;font-size:11.5px;color:var(--ink-3)}
.hint{color:var(--ink-2);text-align:center;padding:40px 20px;font-size:15px}
/* informe semanal (solo se ve al imprimir) */
#informe{display:none}
.rep{font-size:12px;color:#000;background:#fff}
.rep h2{font-size:16px;margin:0 0 2px}

.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0 14px}

</style>

<script>
const PAUTAS = __PAUTAS__;
const PLANES = __PLANES__;
const CMAESTRO = LUB.datos.cons_maestro, CSTOCK = LUB.datos.cons_stock; /* stock de lubricantes (bajo mínimo) */
const RPREV = LUB.datos.rprev; /* historial de la ruta crítica (para el promedio por punto) */
__RUTA_CATALOGO__
const META_RUTA={}; RUTA.forEach(s=>s.items.forEach(it=>{ META_RUTA[it[0]]={l:it[1],sub:it[2],u:it[3],sec:s.sec}; }));
let _promRuta=null;
function promRuta(){ if(_promRuta) return _promRuta; const acc={}; for(const f in RPREV){ const d=RPREV[f]; for(const id in d){ if(typeof d[id]==='number'){ (acc[id]=acc[id]||[]).push(d[id]); } } } _promRuta={}; for(const id in acc){ if(acc[id].length>=3) _promRuta[id]=acc[id].reduce((a,b)=>a+b,0)/acc[id].length; } return _promRuta; }
function alertasRuta(fechas){ /* valores de la semana con desviación ≥25% respecto al promedio histórico */
  const P=promRuta(), out=[];
  fechas.forEach(f=>{ const rd=RUTA_DOCS()[f]; if(!rd||!rd.vals) return; for(const id in rd.vals){ const v=parseFloat(String(rd.vals[id].v||'').replace(',','.')); if(isNaN(v)||P[id]===undefined||Math.abs(P[id])<0.5) continue; const pct=(v-P[id])/Math.abs(P[id])*100; if(Math.abs(pct)>=25) out.push({f,id,v,prom:P[id],pct,meta:META_RUTA[id]||{l:id,sub:'',u:'',sec:''}}); } });
  return out.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
}
function RUTA_DOCS(){ return RUTA_CLOUD; }
function stockBajo(){
  const st={}; for(const m of CMAESTRO){ st[m.id]=(CSTOCK[String(m.id)]||{total:0}).total; }
  const movs=(CLOUD['CONS-MOVS']&&CLOUD['CONS-MOVS'].m)||{};
  for(const k in movs){ const mv=movs[k]; if(st[mv.id]===undefined) continue; st[mv.id]+=(mv.mov==='ENTRADA'?1:-1)*Number(mv.cant||0); }
  return CMAESTRO.filter(m=>st[m.id]<m.min).map(m=>({prod:m.prod,ubi:m.ubi,uni:m.uni,stock:st[m.id],min:m.min})).sort((a,b)=>(a.stock/(a.min||1))-(b.stock/(b.min||1)));
}
/* la semana actual se calcula sola desde el ancla (jueves 13.08.2026 = semana 33) */
const SEMANA_ACTUAL = Math.min(52, Math.max(1, 33 + Math.floor((Date.now()-new Date(2026,7,13).getTime())/(7*24*3600*1000))));
const byId = Object.fromEntries(PAUTAS.map(p=>[p.id,p]));
const ANCHOR = new Date(2026,7,13);
const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
function rangoSemana(w){ const j=new Date(ANCHOR); j.setDate(j.getDate()+(w-33)*7); const m=new Date(j); m.setDate(m.getDate()+6); return {ini:j,fin:m}; }
function relTime(iso){
  if(!iso) return '';
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60) return 'hace instantes';
  if(s<3600) return 'hace '+Math.floor(s/60)+' min';
  if(s<86400) return 'hace '+Math.floor(s/3600)+' h';
  return 'hace '+Math.floor(s/86400)+' d';
}
let view={name:'semanas'};

const firebaseConfig = {
  apiKey: "AIzaSyANENea2R3eQHZufJipvEWIkMKwVvqJeVs",
  authDomain: "lubricacion-teck-qb.firebaseapp.com",
  projectId: "lubricacion-teck-qb",
  storageBucket: "lubricacion-teck-qb.firebasestorage.app",
  messagingSenderId: "697204585611",
  appId: "1:697204585611:web:824c3cf28291bdf1ec108e"
};
let CLOUD={}; let RUTA_CLOUD={}; let cloudReady=false; let cloudErr=false; let subvista='resumen';
try{
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); /* el candado (gate.html) ya la inicializa */
  const db=firebase.firestore();
  db.collection('pautas').onSnapshot(snap=>{
    const next={};
    snap.forEach(doc=>{ next[doc.id]=doc.data(); });
    CLOUD=next; cloudReady=true; render();
  }, err=>{ cloudErr=true; render(); });
  db.collection('ruta').onSnapshot(snap=>{
    const next={};
    snap.forEach(doc=>{ next[doc.id]=doc.data(); });
    RUTA_CLOUD=next; render();
  }, ()=>{});
}catch(e){ cloudErr=true; }

function otObj(ot){ for(const w of Object.values(PLANES)) for(const d of w.days) for(const o of d.ots) if(o.ot===ot) return o; return null; }
function progress(o){
  const p=byId[o.pauta]; const c=CLOUD[o.ot];
  const total=p.acts.length;
  const done=c&&c.acts? p.acts.filter(a=>c.acts[a.n]&&c.acts[a.n].e).length : 0;
  return {done,total,has:!!c};
}
function statusClass(pr){ return pr.done===0?'p0':(pr.done>=pr.total?'done':'part'); }
function statusTxt(pr,c){ if(c&&c.cerrada) return '🔒 Cerrada'; return pr.done===0?'Sin datos aún':(pr.done>=pr.total?'✓ Completa':pr.done+'/'+pr.total); }

function render(){
  $('#back').style.display = view.name==='semanas' ? 'none' : 'block';
  if(view.name==='semanas') renderSemanas();
  else if(view.name==='dias') renderDias();
  else if(view.name==='dia') renderDia();
  else if(view.name==='detalle') renderDetalle();
}
function goBack(){
  if(view.name==='detalle') view={name:'dia',week:view.week,di:view.di};
  else if(view.name==='dia') view={name:'dias',week:view.week};
  else view={name:'semanas'};
  render();
}
$('#back').onclick=goBack;

function connBadge(){
  if(cloudErr) return `<div class="offlinebox">⚠ No se pudo conectar a la nube. Revisa tu conexión a internet — el Panorama necesita señal para mostrar el avance del equipo (las pautas en cada teléfono se guardan igual, sin problema).</div>`;
  if(!cloudReady) return `<div class="offlinebox">⏳ Conectando con la nube…</div>`;
  return `<div class="livepill"><span class="dot"></span>En vivo — actualizado en este instante</div>`;
}

function renderSemanas(){
  let cards='';
  for(let w=1;w<=52;w++){
    const t=(w%2===1)?'A':'B';
    const r=rangoSemana(w);
    const has=!!PLANES[w];
    cards+=`<button class="wcard ${w===SEMANA_ACTUAL?'now':''} ${has?'':'nodata'}" data-w="${w}">
      <div class="wn">Semana ${w}</div>
      <div class="wd">Jue ${fmt(r.ini)} – Mié ${fmt(r.fin)}</div>
      <span class="wt ${t}">TURNO ${t}</span>
    </button>`;
  }
  $('#root').innerHTML=`
    <div class="dayhdr">📊 Supervisión</div>
    <p class="daysub">Avance en vivo del equipo: cumplimiento de pautas por técnico, hallazgos que requieren acción y ronda nocturna. Elige la semana (la actual viene destacada).</p>
    ${connBadge()}
    ${(()=>{ /* tendencia de cumplimiento por semana cargada */
      const filas=Object.keys(PLANES).map(Number).sort((a,b)=>a-b).map(w=>{
        const plan=PLANES[w]; let conp=0,done=0,cerr=0,m=0;
        plan.days.forEach(d=>d.ots.forEach(o=>{ if(!o.pauta) return; conp++; const c=CLOUD[o.ot]; const pr=progress(o); if(pr.done>=pr.total&&pr.total) done++; if(c&&c.cerrada) cerr++; if(c&&c.acts){ const pp=byId[o.pauta]; pp.acts.forEach(a=>{ if(c.acts[a.n]&&c.acts[a.n].e==='M') m++; }); } }));
        const pct=conp?Math.round(100*done/conp):0;
        return `<tr><td>Semana ${w}${w===SEMANA_ACTUAL?' <span class="hoytag">ACTUAL</span>':''}</td><td class="num">${conp}</td><td class="num">${done}</td><td class="num">${cerr}</td><td class="num" style="color:${pct>=90?'var(--ok)':(pct>=60?'var(--orange-ink)':'var(--bad)')}">${pct}%</td><td class="num" style="color:${m?'var(--bad)':'inherit'}">${m}</td></tr>`;
      }).join('');
      return `<div class="sec2"><h3>📈 Cumplimiento por semana</h3><table class="tbl"><tr><th>Semana</th><th>Con pauta</th><th>Completas</th><th>Cerradas</th><th>%</th><th>Hallazgos M</th></tr>${filas}</table></div>`;
    })()}
    <div class="wgrid">${cards}</div>`;
  document.querySelectorAll('.wcard').forEach(b=>b.onclick=()=>{ view={name:'dias',week:+b.dataset.w}; render(); });
}

function renderDias(){
  const w=view.week; const t=(w%2===1)?'A':'B'; const plan=PLANES[w];
  const r=rangoSemana(w);
  let body, summHtml='';
  if(!plan){
    body=`<div class="hint">📭 El programa de la Semana ${w} aún no está cargado.</div>`;
  } else {
    let tot={done:0,part:0,p0:0,sind:0};
    body=plan.days.map((d,i)=>{
      let dd=0,dpart=0,dp0=0,dsind=0;
      d.ots.forEach(o=>{
        if(!o.pauta){ dsind++; return; }
        const pr=progress(o); const cls=statusClass(pr);
        if(cls==='done') dd++; else if(cls==='part') dpart++; else dp0++;
      });
      tot.done+=dd; tot.part+=dpart; tot.p0+=dp0; tot.sind+=dsind;
      const chips=[dd?`<span class="mini done">${dd} ✓</span>`:'', dpart?`<span class="mini part">${dpart} parcial</span>`:'', dp0?`<span class="mini p0">${dp0} pend.</span>`:''].join('');
      return `<button class="dcard" data-i="${i}">
        <span class="dn">${esc(d.nombre)}</span><span class="df">${esc(d.fecha)}</span>
        <span class="dc">${chips||'<span class="mini p0">sin pautas</span>'}</span>
      </button>`;
    }).join('');
    const conPauta=tot.done+tot.part+tot.p0;
    const pct=conPauta?Math.round(100*tot.done/conPauta):0;
    /* --- por técnico, hallazgos "M" y ronda nocturna de la semana --- */
    const porTec={}; const hallazgos=[];
    plan.days.forEach((d,di)=>d.ots.forEach(o=>{
      if(!o.pauta) return;
      const c=CLOUD[o.ot]; if(!c) return;
      const pr=progress(o); const cls=statusClass(pr);
      const nombre=(c.tecnico||(c.actualizadoPor&&c.actualizadoPor.nombre)||'').trim()||'— sin técnico —';
      const t=porTec[nombre]=porTec[nombre]||{done:0,part:0,m:0};
      if(cls==='done') t.done++; else if(cls==='part') t.part++;
      const p=byId[o.pauta];
      for(const a of p.acts){ const st=(c.acts||{})[a.n]; if(st&&st.e==='M'){ t.m++; hallazgos.push({ot:o.ot,tag:o.tag,desc:o.desc,dia:d.nombre,di,n:a.n,ad:a.d,v:st.v||'',o:st.o||'',tec:nombre,upd:c.updatedAt||''}); } }
    }));
    hallazgos.sort((a,b)=>(b.upd||'').localeCompare(a.upd||''));
    const tecRows=Object.entries(porTec).sort((a,b)=>(b[1].done+b[1].part)-(a[1].done+a[1].part)).map(([n,t])=>`<tr><td>${esc(n)}</td><td class="num">${t.done}</td><td class="num">${t.part}</td><td class="num" style="color:${t.m?'var(--bad)':'inherit'}">${t.m}</td></tr>`).join('');
    const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const NOM=['Jue','Vie','Sáb','Dom','Lun','Mar','Mié'];
    let noches=0; const nochesHtml=[];
    const fechasSem=[];
    for(let i=0;i<7;i++){ const f=new Date(r.ini); f.setDate(f.getDate()+i); const k=iso(f); fechasSem.push(k); const rd=RUTA_CLOUD[k]; const lleno=!!(rd&&rd.vals&&Object.values(rd.vals).some(x=>x&&(String(x.v||'').trim()||x.e))); if(lleno) noches++; nochesHtml.push(`<span class="night ${lleno?'ok':'no'}" title="${esc((rd&&[rd.noc,rd.noc2].filter(Boolean).join(' / '))||'')}">${NOM[i]} ${fmt(f)}${lleno?' ✓':''}</span>`); }
    summHtml=`
    <div class="kp">
      <div class="k ${pct>=90?'ok':(pct>=60?'warn':'bad')}"><b>${pct}%</b><span>Cumplimiento</span></div>
      <div class="k ok"><b>${tot.done}</b><span>Completas</span></div>
      <div class="k warn"><b>${tot.part}</b><span>En progreso</span></div>
      <div class="k"><b>${tot.p0}</b><span>Pendientes</span></div>
      <div class="k bad"><b>${hallazgos.length}</b><span>Hallazgos M</span></div>
      <div class="k ${noches>=Math.min(7,Math.max(1,Math.ceil((Date.now()-r.ini.getTime())/86400000)))?'ok':'warn'}"><b>${noches}/7</b><span>Noches ruta</span></div>
    </div>
    <div class="vw">
      <button class="${subvista==='resumen'?'on':''}" data-v="resumen">Resumen</button>
      <button class="${subvista==='hallazgos'?'on':''}" data-v="hallazgos">⚠ Hallazgos (${hallazgos.length})</button>
      <button class="${subvista==='dias'?'on':''}" data-v="dias">Por día</button>
      <button id="binforme" style="margin-left:auto;background:var(--accent);color:#fff;border-color:var(--accent)">📄 Informe semanal</button>
      <button id="bexcel" title="Descarga 3 archivos CSV (se abren en Excel): por técnico, hallazgos y avance por día">⬇ Excel</button>
    </div>`;
    /* exportación CSV para Excel (UTF-8 con BOM y ';' como separador, formato es-CL) */
    const csvCelda=v=>{ v=(v==null?'':String(v)); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const csv=(filas)=>'\ufeff'+filas.map(f=>f.map(csvCelda).join(';')).join('\r\n');
    const descargar=(nombre,texto)=>{ const b=new Blob([texto],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); };
    window.__exportarExcel=()=>{
      const tag='S'+w+'_'+fmt(r.ini).replace('.','-');
      descargar('tecnicos_'+tag+'.csv', csv([['Semana','Técnico','Completas','En progreso','Hallazgos M'],...Object.entries(porTec).map(([n,t])=>[w,n,t.done,t.part,t.m])]));
      descargar('hallazgos_'+tag+'.csv', csv([['Semana','Día','OT','TAG','Equipo','N°','Actividad','Valor','Observación','Técnico','Actualizado'],...hallazgos.map(h=>[w,h.dia,h.ot,h.tag,h.desc,h.n,h.ad,h.v,h.o,h.tec,h.upd])]));
      const filasDia=[]; plan.days.forEach(d=>d.ots.forEach(o=>{ const c=CLOUD[o.ot]||{}; const pr=o.pauta?progress(o):null; const est=!o.pauta?'Sin pauta digital':(c.cerrada?'Cerrada':(pr.done===0?'Pendiente':(pr.done>=pr.total?'Completa':'En progreso'))); filasDia.push([w,d.nombre,d.fecha,o.ot,o.tag,o.desc,o.pauta||'',est,pr?pr.done+'/'+pr.total:'',c.tecnico||'',c.tecnico2||'',c.fecha||'',c.hini||'',c.hter||'']); }));
      descargar('avance_'+tag+'.csv', csv([['Semana','Día','Fecha','OT','TAG','Equipo','Pauta','Estado','Avance','Técnico 1','Técnico 2','Fecha reg.','Inicio','Término'],...filasDia]));
    };
    /* informe imprimible (PDF desde el diálogo de impresión) con los datos de la semana */
    const hoy=new Date();
    const gen=hoy.toLocaleDateString('es-CL')+' '+String(hoy.getHours()).padStart(2,'0')+':'+String(hoy.getMinutes()).padStart(2,'0');
    const porDia=plan.days.map(d=>{ let dd=0,dp=0,d0=0,ds=0; d.ots.forEach(o=>{ if(!o.pauta){ds++;return;} const cls=statusClass(progress(o)); if(cls==='done')dd++; else if(cls==='part')dp++; else d0++; }); return `<tr><td>${esc(d.nombre)} ${esc(d.fecha)}</td><td class="num">${d.ots.length}</td><td class="num">${dd}</td><td class="num">${dp}</td><td class="num">${d0}</td><td class="num">${ds}</td></tr>`; }).join('');
    window.__informeHtml=`<div class="rep">
      <div class="rh"><div><h2>Informe semanal de lubricación — Semana ${w} · Turno ${t}</h2><div>Concentradora Teck QB2 · Jueves ${fmt(r.ini)} al Miércoles ${fmt(r.fin)} de ${r.fin.getFullYear()}</div></div><div style="text-align:right;font-size:11px">Generado ${gen}<br>${esc((window.LUB_USER&&window.LUB_USER.nombre)||'')}</div></div>
      <div class="rk"><div><b>${pct}%</b>Cumplimiento</div><div><b>${tot.done}</b>Completas</div><div><b>${tot.part}</b>En progreso</div><div><b>${tot.p0}</b>Pendientes</div><div><b>${hallazgos.length}</b>Hallazgos M</div><div><b>${noches}/7</b>Noches ruta</div></div>
      <h3>Avance por día</h3>
      <table><tr><th>Día</th><th>OT</th><th>Completas</th><th>En progreso</th><th>Pendientes</th><th>Sin pauta digital</th></tr>${porDia}</table>
      <h3>Por técnico</h3>
      ${tecRows?`<table><tr><th>Técnico</th><th>Completas</th><th>En progreso</th><th>Hallazgos M</th></tr>${tecRows}</table>`:'<p>Sin registros esta semana.</p>'}
      <h3>Hallazgos que requieren acción (${hallazgos.length})</h3>
      ${hallazgos.length?`<table><tr><th>TAG</th><th>OT</th><th>Día</th><th>Actividad</th><th>Valor</th><th>Observación</th><th>Técnico</th></tr>${hallazgos.map(h=>`<tr><td class="mono">${esc(h.tag)}</td><td>${h.ot}</td><td>${esc(h.dia)}</td><td>${h.n}. ${esc(h.ad)}</td><td>${esc(h.v)}</td><td>${esc(h.o)}</td><td>${esc(h.tec)}</td></tr>`).join('')}</table>`:'<p>Sin hallazgos "M" registrados.</p>'}
      <h3>Ronda nocturna (Ruta Crítica)</h3>
      <p>${noches} de 7 noches registradas: ${nochesHtml.map(x=>x.replace(/<[^>]+>/g,'')).join(' · ')}</p>
      <p style="font-size:10px;color:#444;margin-top:14px">Informe generado desde la app Maestro de Lubricación · ${tot.sind} OT de la semana sin pauta digital (se ejecutan en papel) · Admin: Nicolás Saravia</p>
    </div>`;
    if(subvista==='resumen'){
      body=`<div class="sec2"><h3>👤 Por técnico</h3>${tecRows?`<table class="tbl"><tr><th>Técnico</th><th>Completas</th><th>En progreso</th><th>Hallazgos M</th></tr>${tecRows}</table>`:'<div class="hint" style="padding:12px">Aún no hay pautas registradas esta semana.</div>'}</div>
      <div class="sec2"><h3>🌙 Ronda nocturna (Ruta Crítica)</h3>${nochesHtml.join('')}<p class="daysub" style="margin:8px 0 0">Pasa el cursor sobre una noche para ver el nochero. Tendencias y detalle en la pestaña Ruta Crítica.</p>
      ${(()=>{ const al=alertasRuta(fechasSem); return al.length?`<h3 style="margin-top:12px">🌡 Desviaciones ≥25% esta semana (${al.length})</h3><table class="tbl"><tr><th>Noche</th><th>Punto</th><th>Valor</th><th>Prom.</th><th>Desv.</th></tr>${al.slice(0,15).map(a=>`<tr><td>${a.f.slice(8,10)}-${a.f.slice(5,7)}</td><td>${esc(a.meta.l)}${a.meta.sub?' · '+esc(a.meta.sub):''}<br><span style="color:var(--ink-3);font-size:11px">${esc(a.meta.sec)}</span></td><td class="num" style="color:${Math.abs(a.pct)>=25?'var(--bad)':'inherit'}">${String(a.v).replace('.',',')} ${esc(a.meta.u)}</td><td class="num">${a.prom.toFixed(1).replace('.',',')}</td><td class="num" style="color:var(--bad)">${a.pct>0?'+':''}${a.pct.toFixed(0)}%</td></tr>`).join('')}</table>`:'<p class="daysub" style="margin:8px 0 0">Sin desviaciones ≥25% respecto al histórico en las rondas de esta semana.</p>'; })()}</div>
      <div class="sec2"><h3>🛢 Lubricantes bajo stock mínimo</h3>${(()=>{ const b=stockBajo(); return b.length?`<table class="tbl"><tr><th>Producto</th><th>Ubicación</th><th>Stock</th><th>Mínimo</th></tr>${b.map(x=>`<tr><td>${esc(x.prod)}</td><td>${esc(x.ubi||'')}</td><td class="num" style="color:var(--bad)">${x.stock.toLocaleString('es-CL',{maximumFractionDigits:1})} ${esc(x.uni)}</td><td class="num">${x.min.toLocaleString('es-CL')} ${esc(x.uni)}</td></tr>`).join('')}</table>`:'<p class="daysub" style="margin:0">Todos los lubricantes están sobre su stock mínimo. 👍</p>'; })()}</div>
      <div class="sec2"><h3>📭 Sin pauta digital</h3><p class="daysub" style="margin:0">${tot.sind} OT de la semana no tienen pauta xlsx en Máximo (PDF escaneado o sin adjunto); se ejecutan en papel.</p></div>`;
    } else if(subvista==='hallazgos'){
      body=hallazgos.length?hallazgos.map(h=>`<button class="hall" data-ot="${h.ot}" data-di="${h.di}">
        <div class="h1"><span class="mono">${esc(h.tag)}</span> · OT ${h.ot} · ${esc(h.dia)}</div>
        <div class="h2">${h.n}. ${esc(h.ad)}${h.v?` — <b>${esc(h.v)}</b>`:''}</div>
        ${h.o?`<div class="obs">"${esc(h.o)}"</div>`:''}
        <div class="h3">👤 ${esc(h.tec)}${h.upd?' · '+relTime(h.upd):''} · ${esc(h.desc)}</div>
      </button>`).join(''):'<div class="hint">Sin hallazgos "M" (malo) registrados esta semana. 👍</div>';
    }
  }
  $('#root').innerHTML=`
    <div class="dayhdr">Semana ${w} · Turno ${t}</div>
    <p class="daysub">Jueves ${fmt(r.ini)} al Miércoles ${fmt(r.fin)}</p>
    ${connBadge()}
    ${summHtml}
    ${body}`;
  document.querySelectorAll('.dcard').forEach(b=>b.onclick=()=>{ view={name:'dia',week:w,di:+b.dataset.i}; render(); });
  document.querySelectorAll('.vw button[data-v]').forEach(b=>b.onclick=()=>{ subvista=b.dataset.v; render(); });
  const bx=$('#bexcel'); if(bx) bx.onclick=()=>window.__exportarExcel();
  const bi=$('#binforme'); if(bi) bi.onclick=()=>{ $('#informe').innerHTML=window.__informeHtml||''; document.body.classList.add('imprimiendo'); window.print(); setTimeout(()=>document.body.classList.remove('imprimiendo'),1500); };
  document.querySelectorAll('.hall').forEach(b=>b.onclick=()=>{ view={name:'detalle',week:w,di:+b.dataset.di,ot:b.dataset.ot}; render(); });
}

function renderDia(){
  const plan=PLANES[view.week]; const d=plan.days[view.di];
  $('#root').innerHTML=`
    <div class="dayhdr">${esc(d.nombre)} ${esc(d.fecha)} · Semana ${view.week}</div>
    <p class="daysub">${d.ots.length} órdenes de trabajo</p>
    ${connBadge()}
    ${d.ots.map(o=>{
      if(!o.pauta) return `<div class="otcard nop">
        <div class="otinfo">
          <div class="tag mono">${esc(o.tag)}</div>
          <div class="otd">${esc(o.desc)}</div>
          <div class="otmeta">OT ${o.ot} · ${esc(o.esp)}</div>
        </div>
        <div class="prog"><span class="ring sind">Sin pauta digital</span></div>
      </div>`;
      const pr=progress(o); const c=CLOUD[o.ot];
      const cls=statusClass(pr);
      return `<button class="otcard" data-ot="${o.ot}">
        <div class="otinfo">
          <div class="tag mono">${esc(o.tag)}</div>
          <div class="otd">${esc(o.desc)}</div>
          <div class="otmeta">OT ${o.ot} · ${esc(byId[o.pauta].titulo)}</div>
          ${c&&c.tecnico?`<div class="tecmeta">👤 ${esc([c.tecnico,c.tecnico2].filter(Boolean).join(' / '))}</div>`:''}
        </div>
        <div class="prog">
          <span class="ring ${c&&c.cerrada?'done':cls}">${statusTxt(pr,c)}</span>
          ${c&&c.updatedAt?`<div class="updated">${relTime(c.updatedAt)}</div>`:''}
        </div>
      </button>`;
    }).join('')}`;
  document.querySelectorAll('.otcard[data-ot]').forEach(b=>b.onclick=()=>{ view={name:'detalle',week:view.week,di:view.di,ot:b.dataset.ot}; render(); });
}

function renderDetalle(){
  const ot=view.ot; const o=otObj(ot); const p=byId[o.pauta]; const c=CLOUD[ot]||{};
  const plan=PLANES[view.week]; const dia=plan.days[view.di];
  let lastG=null; let actsHtml='';
  for(const a of p.acts){
    if(a.g!==lastG){ actsHtml+=`<div class="grp">${esc(a.g||'Actividades')}</div>`; lastG=a.g; }
    const st=(c.acts&&c.acts[a.n])||{};
    actsHtml+=`<div class="act">
      <div class="ad"><span class="an">${a.n}.</span>${esc(a.d)}</div>
      <div class="row2">
        ${st.v?`<span class="val">${esc(st.v)}</span>`:''}
        <span class="est ${st.e||'none'}">${st.e||'— sin registrar —'}</span>
      </div>
      ${st.o?`<div class="obs">"${esc(st.o)}"</div>`:''}
    </div>`;
  }
  $('#root').innerHTML=`
    <div class="dhdr">
      <div class="tag mono">${esc(o.tag)}</div>
      <div class="fd">${esc(o.desc)} · ${esc(dia.nombre)} ${esc(dia.fecha)} · ${esc(p.titulo)}</div>
      <div class="frow">
        <div><b>Técnico(s)</b>${esc([c.tecnico,c.tecnico2].filter(Boolean).join(' / ')||'— sin datos —')}</div>
        <div><b>Fecha</b>${esc(c.fecha||'—')}</div>
        <div><b>Hora inicio</b>${esc(c.hini||'—')}</div>
        <div><b>Hora término</b>${esc(c.hter||'—')}</div>
      </div>
    </div>
    ${connBadge()}
    ${actsHtml}
    <div class="grp">Observaciones generales</div>
    <div class="obsgbox">${c.obsg?esc(c.obsg):'<i>Sin observaciones registradas.</i>'}</div>
    ${c.updatedAt?`<p class="daysub" style="margin-top:10px">Última actualización: ${relTime(c.updatedAt)}</p>`:''}
    `;
}

render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js')); }
</script>
</body>
</html>
