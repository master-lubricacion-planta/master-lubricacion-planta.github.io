<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --line:#dde3ee; --ink:#101a33; --ink-2:#4a5776; --ink-3:#8391ad;
  --accent:#0c2a66; --accent-soft:#e4ebf8; --accent-ink:#0c2a66;
  --navy:#0b1c47; --navy-2:#12295e; --on-navy:#ffffff; --on-navy-2:#9db1d9;
  --orange:#f5822b; --orange-soft:#fdebd7; --orange-ink:#9c5a12;
  --ok:#1d7a4f; --ok-bg:#dff1e7; --bad:#b3261e; --bad-bg:#f9e0de; --na:#5f6b85; --na-bg:#e7ebf3;
  --tA:#0c5c8a; --tA-bg:#ddeefa; --tB:#6d28a8; --tB-bg:#efe3fa;
  --shadow:0 1px 3px rgba(11,28,71,.08),0 6px 18px rgba(11,28,71,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a1128; --surface:#111c3d; --line:#243459; --ink:#e8edf8; --ink-2:#a3b1d0; --ink-3:#6d7c9e;
    --accent:#7da4e8; --accent-soft:#1a2c5c; --accent-ink:#aec8f5;
    --navy:#060d24; --navy-2:#0d1a40; --on-navy:#ffffff; --on-navy-2:#8fa5d4;
    --orange:#f5822b; --orange-soft:#3d2a12; --orange-ink:#f0b070;
    --ok:#57c093; --ok-bg:#173628; --bad:#f2998f; --bad-bg:#42201d; --na:#9daac6; --na-bg:#1c2749;
    --tA:#7bc4f0; --tA-bg:#0e2c40; --tB:#c9a2ee; --tB-bg:#2b1840;
    --shadow:0 1px 3px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1128; --surface:#111c3d; --line:#243459; --ink:#e8edf8; --ink-2:#a3b1d0; --ink-3:#6d7c9e;
  --accent:#7da4e8; --accent-soft:#1a2c5c; --accent-ink:#aec8f5;
  --navy:#060d24; --navy-2:#0d1a40; --on-navy:#ffffff; --on-navy-2:#8fa5d4;
  --orange:#f5822b; --orange-soft:#3d2a12; --orange-ink:#f0b070;
  --ok:#57c093; --ok-bg:#173628; --bad:#f2998f; --bad-bg:#42201d; --na:#9daac6; --na-bg:#1c2749;
  --tA:#7bc4f0; --tA-bg:#0e2c40; --tB:#c9a2ee; --tB-bg:#2b1840;
  --shadow:0 1px 3px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#f4f6fa; --surface:#ffffff; --line:#dde3ee; --ink:#101a33; --ink-2:#4a5776; --ink-3:#8391ad;
  --accent:#0c2a66; --accent-soft:#e4ebf8; --accent-ink:#0c2a66;
  --navy:#0b1c47; --navy-2:#12295e; --on-navy:#ffffff; --on-navy-2:#9db1d9;
  --orange:#f5822b; --orange-soft:#fdebd7; --orange-ink:#9c5a12;
  --ok:#1d7a4f; --ok-bg:#dff1e7; --bad:#b3261e; --bad-bg:#f9e0de; --na:#5f6b85; --na-bg:#e7ebf3;
  --tA:#0c5c8a; --tA-bg:#ddeefa; --tB:#6d28a8; --tB-bg:#efe3fa;
  --shadow:0 1px 3px rgba(11,28,71,.08),0 6px 18px rgba(11,28,71,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
button{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:10;background:linear-gradient(100deg,var(--navy),var(--navy-2));padding:12px 14px 0;border-bottom:3px solid var(--orange)}
.brand{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex:0 0 auto;text-decoration:none}
.logo svg{width:22px;height:22px;fill:#fff}
.brand h1{font-size:17px;font-weight:800;margin:0;color:var(--on-navy)}
.brand .sub{display:block;font-size:10.5px;font-weight:600;color:var(--on-navy-2);text-transform:uppercase;letter-spacing:.1em}
.brandright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tecklogo{height:24px;width:auto;display:block}
.adminline{font-size:9.5px;font-weight:600;color:var(--on-navy-2);letter-spacing:.05em;white-space:nowrap}
.tabs{display:flex;align-items:center;gap:10px;max-width:820px;margin:10px auto 0}
.tabs a{color:var(--on-navy-2);text-decoration:none;font-size:14px;font-weight:700;padding:8px 2px 10px;border-bottom:3px solid transparent;margin-bottom:-3px}
.tabs a.on{color:var(--on-navy);border-bottom-color:var(--orange)}
.tabs .slash{color:var(--on-navy-2);font-weight:300;font-size:17px}
#back{margin-left:auto;margin-bottom:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:var(--on-navy);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;cursor:pointer;display:none}

main{padding:14px;max-width:820px;margin:0 auto}
.dayhdr{font-size:19px;font-weight:800;margin:4px 2px 2px}
.daysub{font-size:13px;color:var(--ink-2);margin:0 2px 14px}

/* semanas */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.wcard .wn{font-weight:800;font-size:15px}
.wcard .wd{font-size:11px;color:var(--ink-3);margin-top:2px}
.wcard .wt{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;margin-top:6px;letter-spacing:.04em}
.wcard .wt.A{background:var(--tA-bg);color:var(--tA)}
.wcard .wt.B{background:var(--tB-bg);color:var(--tB)}
.wcard.now{border:2px solid var(--orange);background:var(--card-grad)}
.wcard.now .wn::after{content:' · ACTUAL';color:var(--orange);font-size:10px;letter-spacing:.05em}
.wcard.nodata{opacity:.55}

/* días */
.dcard{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.dcard .dn{font-weight:800;font-size:15px;min-width:96px}
.dcard .df{color:var(--ink-3);font-size:13px}
.dcard .dc{margin-left:auto;font-size:12.5px;color:var(--ink-2);text-align:right}
.dcard .dc b{color:var(--accent-ink)}

.otcard{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow);padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:12px}
.otcard.nop{cursor:default;opacity:.62}
.otcard .otinfo{flex:1;min-width:0}
.otcard .tag{font-weight:800;font-size:15px}
.otcard .otd{font-size:13px;color:var(--ink-2);margin-top:1px}
.otcard .otmeta{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.prog{flex:0 0 auto;text-align:right}
.ring{font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px;white-space:nowrap}
.ring.p0{background:var(--na-bg);color:var(--na)}
.ring.part{background:var(--orange-soft);color:var(--orange-ink)}
.ring.done{background:var(--ok-bg);color:var(--ok)}
.ring.sind{background:var(--bg);color:var(--ink-3);border:1px dashed var(--line)}

.fhdr{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.fhdr .tag{font-weight:800;font-size:17px}
.fhdr .fd{font-size:13.5px;color:var(--ink-2);margin:2px 0 10px}
.eqimg{width:100%;max-height:260px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.otfield{background:var(--orange-soft);border:2px solid var(--orange);border-radius:11px;padding:10px 12px;margin-bottom:10px}
.otfield label{font-size:11px;font-weight:800;color:var(--orange-ink);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
.otfield input{width:100%;padding:10px;font-size:18px;font-weight:800;border:1.5px solid var(--orange);border-radius:9px;background:var(--surface);color:var(--ink);font-family:ui-monospace,Consolas,monospace}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frow label{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.frow input{width:100%;padding:9px 10px;font-size:15px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.grp{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);margin:16px 2px 8px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.act .ad{font-size:14px;font-weight:600;line-height:1.35}
.act .an{color:var(--ink-3);font-weight:800;margin-right:4px}
.act .lim{font-size:12px;color:var(--ink-2);background:var(--accent-soft);border-radius:8px;padding:6px 9px;margin-top:7px;white-space:pre-line}
.act .lim.ov{border-left:3px solid var(--orange)}
.actrow{display:flex;gap:8px;margin-top:9px;align-items:center;flex-wrap:wrap}
.val{flex:1;min-width:110px;padding:9px 10px;font-size:16px;font-weight:700;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:6px;flex:0 0 auto}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:800;cursor:pointer}
.chip.B.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.chip.M.on{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.chip.NA.on{background:var(--na-bg);color:var(--na);border-color:var(--na)}
.obs{width:100%;margin-top:8px;padding:8px 10px;font-size:14px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.obsg{width:100%;min-height:70px;padding:10px;font-size:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit}

.fotos{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-top:14px}
.fotos.locked{opacity:.85}
.fotos h3{margin:0 0 4px;font-size:15px}
.fotos .fsub{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.lockmsg{background:var(--orange-soft);color:var(--orange-ink);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fslot{position:relative;border:2px dashed var(--line);border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--ink-3);font-size:12px;font-weight:700;cursor:pointer;overflow:hidden;background:var(--bg)}
.fslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fslot .del{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer;z-index:2}
.fslot .cam{font-size:26px}
.btnbar{display:flex;gap:8px;margin:14px 0 30px}
.btn{flex:1;padding:13px;border-radius:11px;border:0;font-weight:800;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0a1128}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink-2)}
.savemsg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.savemsg.show{opacity:.95}
.offlinetag{font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-bg);display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.fab-save{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:40;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 30px;font-weight:800;font-size:15.5px;box-shadow:0 8px 24px rgba(11,28,71,.4);cursor:pointer;align-items:center;gap:9px}
.fab-save.show{display:flex}
:root[data-theme="dark"] .fab-save{color:#0a1128}
.fab-save .ic{font-size:18px}
.fab-save.saved{background:var(--ok)}
.fabspacer{height:78px}
footer{padding:8px 14px 28px;text-align:center;font-size:11.5px;color:var(--ink-3)}
.hint{color:var(--ink-2);text-align:center;padding:40px 20px;font-size:15px}

#informe{display:none}
.repwrap{background:#fff;color:#000}
@media print{
  header,#listado,#form,footer,.noprint{display:none!important}
  #informe{display:block!important}
  body{background:#fff}
  main{max-width:100%;padding:0}
}
.rep{font-size:12px;color:#000}
.rep h2{font-size:16px;margin:0 0 2px}
.rep .rh{display:flex;justify-content:space-between;border-bottom:2.5px solid #0b1c47;padding-bottom:6px;margin-bottom:8px}
.rep table{width:100%;border-collapse:collapse;margin-top:6px}
.rep th,.rep td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top;font-size:11px}
.rep th{background:#e8ecf5}
.rep .gr td{background:#f0f2f8;font-weight:700;text-transform:uppercase;font-size:10px}
.rep .foot{margin-top:10px;font-size:10px;color:#444;display:flex;justify-content:space-between}
.rep .fotosrep{display:flex;gap:8px;margin-top:10px}
.rep .fotosrep img{width:32%;border:1px solid #999}
.rep .otbox{border:2px solid #b45309;background:#fdebd7;padding:4px 10px;border-radius:6px;font-weight:800}
</style>
</head>

let dbp=null;
function idb(){ if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{ const r=indexedDB.open('pautasfotos',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('fotos');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  return dbp; }
async function fotoPut(k,blob){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('fotos','readwrite'); t.objectStore('fotos').put(blob,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function fotoGet(k){ const db=await idb(); return new Promise((res)=>{ const r=db.transaction('fotos').objectStore('fotos').get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); }
async function fotoDel(k){ const db=await idb(); return new Promise((res)=>{ const t=db.transaction('fotos','readwrite'); t.objectStore('fotos').delete(k); t.oncomplete=res; t.onerror=res; }); }
function comprimir(file){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const M=1100; let w=img.width,h=img.height; if(w>M){h=h*M/w;w=M} if(h>M){w=w*M/h;h=M}
  const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
  c.toBlob(b=>res(b),'image/jpeg',.65); URL.revokeObjectURL(img.src); }; img.src=URL.createObjectURL(file); }); }

function otObj(ot){ for(const w of Object.values(PLANES)) for(const d of w.days) for(const o of d.ots) if(o.ot===ot) return o; return null; }
function limFor(o,a){ const ov=(OVERRIDES[o.pauta]||{})[o.tag]||{}; return {lim: ov[a.n]||a.lim, custom: !!ov[a.n]}; }
function reqComplete(o,d){
  const p=byId[o.pauta]; d.acts=d.acts||{};
  if(!(d.ot||'').trim()) return false;
  for(const a of p.acts){
    const st=d.acts[a.n]||{};
    if(!st.e) return false;
    if(/^MEDIR/i.test(a.d) && st.e!=='NA' && !(st.v||'').toString().trim()) return false;
  }
  return true;
}
function progress(o){
  const p=byId[o.pauta]; const d=load(o.ot);
  const total=p.acts.length;
  const done=p.acts.filter(a=>d.acts&&d.acts[a.n]&&d.acts[a.n].e).length;
  return {done,total};
}

function render(){

  if(view.name==='semanas') renderSemanas();
  else if(view.name==='dias') renderDias();
  else if(view.name==='dia') renderDia();

  window.scrollTo(0,0);
}
function goBack(){
  if(view.name==='formulario') view={name:'dia',week:view.week,di:view.di};
  else if(view.name==='dia') view={name:'dias',week:view.week};

  render();
}

function renderSemanas(){
  let cards='';
  for(let w=1;w<=52;w++){
    const t=(w%2===1)?'A':'B';
    const r=rangoSemana(w);
    const has=!!PLANES[w];
    cards+=`<button class="wcard ${w===SEMANA_ACTUAL?'now':''} ${has?'':'nodata'}" data-w="${w}">
      <div class="wn">Semana ${w}</div>
      <div class="wd">Jue ${fmt(r.ini)} – Mié ${fmt(r.fin)}</div>
      <span class="wt ${t}">TURNO ${t}</span>
    </button>`;
  }
  $('#listado').innerHTML=`
    <div class="dayhdr">Plan semanal ${new Date().getFullYear()===2026?'2026':''}</div>
    <p class="daysub">Jornada 7×7 · semanas impares <b>Turno A</b>, pares <b>Turno B</b>. Estás en la <b>Semana ${SEMANA_ACTUAL} · Turno A</b>.</p>
    <div class="wgrid">${cards}</div>`;
  document.querySelectorAll('.wcard').forEach(b=>b.onclick=()=>{ view={name:'dias',week:+b.dataset.w}; render(); });
}

function renderDias(){
  const w=view.week; const t=(w%2===1)?'A':'B'; const plan=PLANES[w];

  if(!plan){
    body=`<div class="hint">📭 El programa de la Semana ${w} aún no está cargado.<br><br>Cuando llegue el plan semanal, el administrador lo sube y aparecerá aquí.</div>`;

        <span class="dn">${esc(d.nombre)}</span><span class="df">${esc(d.fecha)}</span>
        <span class="dc"><b>${d.ots.length}</b> OT · ${conp} con pauta digital</span>
      </button>`;

  $('#listado').innerHTML=`
    <div class="dayhdr">Semana ${w} · Turno ${t}</div>
    <p class="daysub">Jueves ${fmt(r.ini)} al Miércoles ${fmt(r.fin)} (jornada 7×7)</p>

  const ot=view.ot; cur=ot;
  const o=otObj(ot); const p=byId[o.pauta]; const d=load(ot);
  const plan=PLANES[view.week]; const dia=plan.days[view.di];
  d.acts=d.acts||{};
  let lastG=null; let actsHtml='';
  for(const a of p.acts){
    if(a.g!==lastG){ actsHtml+=`<div class="grp">${esc(a.g||'Actividades')}</div>`; lastG=a.g; }
    const st=d.acts[a.n]||{};
    const medir=/^MEDIR/i.test(a.d);
    const L=limFor(o,a);
    actsHtml+=`<div class="act" data-n="${a.n}">
      <div class="ad"><span class="an">${a.n}.</span>${esc(a.d)}</div>
      ${L.lim?`<div class="lim ${L.custom?'ov':''}">${L.custom?'⭐ Parámetro específico de este equipo:\n':''}${esc(L.lim)}</div>`:''}
      <div class="actrow">
        ${medir?`<input class="val" inputmode="decimal" placeholder="Valor medido *" value="${esc(st.v||'')}">`:''}
        <div class="chips">
          <button class="chip B ${st.e==='B'?'on':''}">B</button>
          <button class="chip M ${st.e==='M'?'on':''}">M</button>
          <button class="chip NA ${st.e==='NA'?'on':''}">N/A</button>
        </div>
      </div>
      <input class="obs" placeholder="Observación (opcional)" value="${esc(st.o||'')}">
    </div>`;
  }
  const hasImg=IMGPLNS.includes(o.pauta);
  $('#form').innerHTML=`
    <div class="fhdr">
      <div class="tag mono">${esc(o.tag)}</div>
      <div class="fd">${esc(o.desc)} · ${esc(dia.nombre)} ${esc(dia.fecha)} · ${esc(p.titulo)} (${esc(o.pauta)})</div>
      <div class="offlinetag">📴 Funciona sin internet — se guarda en este teléfono</div><br>
      ${hasImg?`<img class="eqimg" src="pautas-img/${o.pauta}.jpg" alt="Equipo">`:''}
      <div class="otfield">
        <label>⚠ N° Orden de Trabajo (obligatorio)</label>
        <input id="fot" inputmode="numeric" placeholder="Ej: ${o.ot}" value="${esc(d.ot||o.ot)}">
      </div>
      <div class="frow">
        <div><label>Técnico(s)</label><input id="ftec" value="${esc(d.tecnico||'')}" placeholder="Nombre"></div>
        <div><label>Fecha</label><input id="ffecha" value="${esc(d.fecha||new Date().toLocaleDateString('es-CL'))}"></div>
        <div><label>Hora inicio</label><input id="fini" value="${esc(d.hini||'')}" placeholder="HH:MM"></div>
        <div><label>Hora término</label><input id="fter" value="${esc(d.hter||'')}" placeholder="HH:MM"></div>
      </div>
    </div>
    ${actsHtml}
    <div class="grp">Observaciones generales</div>
    <textarea class="obsg" id="fobsg" placeholder="Observaciones generales de la inspección…">${esc(d.obsg||'')}</textarea>
    <div class="fotos" id="fotos"></div>
    <div class="btnbar">
      <button class="btn ghost" id="blimpiar">Borrar datos</button>
      <button class="btn primary" id="bimprimir">📄 Informe / Imprimir</button>
    </div>
    <div class="fabspacer"></div>`;
  const persist=()=>{
    d.ot=$('#fot').value; d.tecnico=$('#ftec').value; d.fecha=$('#ffecha').value; d.hini=$('#fini').value; d.hter=$('#fter').value; d.obsg=$('#fobsg').value;
    save(ot,d); renderFotos(o,d);
  };
  ['#fot','#ftec','#ffecha','#fini','#fter','#fobsg'].forEach(s=>$(s).addEventListener('change',persist));
  document.querySelectorAll('.act').forEach(el=>{
    const n=el.dataset.n;
    const st=()=> d.acts[n]=d.acts[n]||{};
    const v=el.querySelector('.val');
    if(v) v.addEventListener('change',()=>{ st().v=v.value; save(ot,d); renderFotos(o,d); });
    el.querySelector('.obs').addEventListener('change',()=>{ st().o=el.querySelector('.obs').value; save(ot,d); });
    el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
      const val=c.classList.contains('B')?'B':(c.classList.contains('M')?'M':'NA');
      st().e = (st().e===val)? '' : val;
      el.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      if(st().e) c.classList.add('on');
      save(ot,d); renderFotos(o,d);
    });
  });
  $('#blimpiar').onclick=async()=>{ if(confirm('¿Borrar todos los datos y fotos ingresados de esta pauta?')){ localStorage.removeItem(K(ot)); for(let i=0;i<3;i++) await fotoDel(ot+'_'+i); render(); } };
  $('#bimprimir').onclick=async()=>{ await renderInforme(ot); window.print(); };
  renderFotos(o,d);

  /* Guardado explícito: recoge TODO lo que haya en pantalla (incluso campos sin confirmar aún) y lo escribe en el dispositivo. No requiere internet: usa localStorage/IndexedDB del propio teléfono. */
  const fab=$('#fabsave'); const fabtxt=fab.querySelector('.fabtxt');
  function saveAll(){
    d.ot=$('#fot').value; d.tecnico=$('#ftec').value; d.fecha=$('#ffecha').value; d.hini=$('#fini').value; d.hter=$('#fter').value; d.obsg=$('#fobsg').value;
    document.querySelectorAll('.act').forEach(el=>{
      const n=el.dataset.n; const st=d.acts[n]=d.acts[n]||{};
      const v=el.querySelector('.val'); if(v) st.v=v.value;
      st.o=el.querySelector('.obs').value;
    });
    save(ot,d); renderFotos(o,d);
    fab.classList.add('saved'); fabtxt.textContent='✓ Guardado en tu teléfono';
    flash('💾 Pauta guardada — no necesitas internet');
    setTimeout(()=>{ fab.classList.remove('saved'); fabtxt.textContent='Guardar pauta'; },1800);
  }
  fab.classList.add('show'); fab.onclick=saveAll;
}

async function renderFotos(o,d){
  const box=$('#fotos'); if(!box) return;
  const ok=reqComplete(o,d);
  if(!ok){
    box.className='fotos locked';
    box.innerHTML=`<h3>📷 Fotografías (3)</h3>
      <div class="lockmsg">🔒 Para habilitar las fotos completa los campos obligatorios: <b>N° de OT</b>, el <b>estado (B/M/N/A)</b> de todas las actividades y el <b>valor medido</b> de cada MEDIR.</div>`;
    return;
  }
  box.className='fotos';
  const slots=[];
  for(let i=0;i<3;i++) slots.push(await fotoGet(cur+'_'+i));
  box.innerHTML=`<h3>📷 Fotografías (3)</h3>
    <p class="fsub">Toca un recuadro para tomar la foto con la cámara o elegirla de la galería.</p>
    <div class="fgrid">${slots.map((b,i)=> b
      ? `<div class="fslot" data-i="${i}"><img src="${URL.createObjectURL(b)}"><button class="del" data-i="${i}">✕</button></div>`
      : `<label class="fslot"><span class="cam">📷</span>Foto ${i+1}<input type="file" accept="image/*" capture="environment" data-i="${i}" hidden></label>`
    ).join('')}</div>`;
  box.querySelectorAll('input[type=file]').forEach(inp=>inp.addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f) return;
    const blob=await comprimir(f);
    await fotoPut(cur+'_'+inp.dataset.i, blob);
    flash('📷 Foto guardada');
    renderFotos(o,load(cur));
  }));
  box.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{ await fotoDel(cur+'_'+b.dataset.i); renderFotos(o,load(cur)); });
}

async function renderInforme(ot){
  const o=otObj(ot); const p=byId[o.pauta]; const d=load(ot); d.acts=d.acts||{};
  const plan=PLANES[view.week]; const dia=plan.days[view.di];
  let rows=''; let lastG=null;
  for(const a of p.acts){
    if(a.g!==lastG){ rows+=`<tr class="gr"><td colspan="5">${esc(a.g||'Actividades')}</td></tr>`; lastG=a.g; }
    const st=d.acts[a.n]||{};
    const L=limFor(o,a);
    rows+=`<tr><td>${a.n}</td><td>${esc(a.d)}${L.custom?' ⭐':''}</td><td>${esc(st.v||'')}</td><td style="text-align:center;font-weight:700">${esc(st.e||'')}</td><td>${esc(st.o||'')}</td></tr>`;
  }
  const fotos=[];
  for(let i=0;i<3;i++){ const b=await fotoGet(ot+'_'+i); if(b) fotos.push(URL.createObjectURL(b)); }
  $('#informe').innerHTML=`<div class="rep repwrap">
    <div class="rh">
      <div><h2>Pauta de Inspección — ${esc(p.titulo)}</h2>
        <div><b>${esc(o.tag)}</b> · ${esc(o.desc)} · Semana ${view.week} · ${esc(dia.nombre)} ${esc(dia.fecha)}</div></div>
      <div style="text-align:right"><span class="otbox">OT ${esc(d.ot||o.ot)}</span><br>${esc(o.pauta)}</div>
    </div>
    <div>Técnico(s): <b>${esc(d.tecnico||'________________')}</b> &nbsp; Fecha: <b>${esc(d.fecha||'')}</b> &nbsp; Inicio: <b>${esc(d.hini||'')}</b> &nbsp; Término: <b>${esc(d.hter||'')}</b></div>
    <table>
      <tr><th style="width:24px">N°</th><th>Actividad</th><th style="width:90px">Valor</th><th style="width:52px">Estado</th><th style="width:170px">Observación</th></tr>
      ${rows}
    </table>
    <div style="margin-top:8px"><b>Observaciones generales:</b> ${esc(d.obsg||'—')}</div>
    ${fotos.length?`<div class="fotosrep">${fotos.map(u=>`<img src="${u}">`).join('')}</div>`:''}
    <div class="foot"><span>Registrado en terreno con app Maestro de Lubricación · Admin: Nicolás Saravia</span><span>Firma: ______________________</span></div>
  </div>`;
}

render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js')); }
</script>
</body>
</html>
