<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --line:#dde3ee; --ink:#101a33; --ink-2:#4a5776; --ink-3:#8391ad;
  --accent:#0c2a66; --accent-soft:#e4ebf8; --accent-ink:#0c2a66;
  --navy:#0b1c47; --navy-2:#12295e; --on-navy:#ffffff; --on-navy-2:#9db1d9;
  --orange:#f5822b; --orange-soft:#fdebd7; --orange-ink:#9c5a12;
  --ok:#1d7a4f; --ok-bg:#dff1e7; --bad:#b3261e; --bad-bg:#f9e0de; --na:#5f6b85; --na-bg:#e7ebf3;
  --tA:#0c5c8a; --tA-bg:#ddeefa; --tB:#6d28a8; --tB-bg:#efe3fa;
  --shadow:0 1px 3px rgba(11,28,71,.08),0 6px 18px rgba(11,28,71,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a1128; --surface:#111c3d; --line:#243459; --ink:#e8edf8; --ink-2:#a3b1d0; --ink-3:#6d7c9e;
    --accent:#7da4e8; --accent-soft:#1a2c5c; --accent-ink:#aec8f5;
    --navy:#060d24; --navy-2:#0d1a40; --on-navy:#ffffff; --on-navy-2:#8fa5d4;
    --orange:#f5822b; --orange-soft:#3d2a12; --orange-ink:#f0b070;
    --ok:#57c093; --ok-bg:#173628; --bad:#f2998f; --bad-bg:#42201d; --na:#9daac6; --na-bg:#1c2749;
    --tA:#7bc4f0; --tA-bg:#0e2c40; --tB:#c9a2ee; --tB-bg:#2b1840;
    --shadow:0 1px 3px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1128; --surface:#111c3d; --line:#243459; --ink:#e8edf8; --ink-2:#a3b1d0; --ink-3:#6d7c9e;
  --accent:#7da4e8; --accent-soft:#1a2c5c; --accent-ink:#aec8f5;
  --navy:#060d24; --navy-2:#0d1a40; --on-navy:#ffffff; --on-navy-2:#8fa5d4;
  --orange:#f5822b; --orange-soft:#3d2a12; --orange-ink:#f0b070;
  --ok:#57c093; --ok-bg:#173628; --bad:#f2998f; --bad-bg:#42201d; --na:#9daac6; --na-bg:#1c2749;
  --tA:#7bc4f0; --tA-bg:#0e2c40; --tB:#c9a2ee; --tB-bg:#2b1840;
  --shadow:0 1px 3px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#f4f6fa; --surface:#ffffff; --line:#dde3ee; --ink:#101a33; --ink-2:#4a5776; --ink-3:#8391ad;
  --accent:#0c2a66; --accent-soft:#e4ebf8; --accent-ink:#0c2a66;
  --navy:#0b1c47; --navy-2:#12295e; --on-navy:#ffffff; --on-navy-2:#9db1d9;
  --orange:#f5822b; --orange-soft:#fdebd7; --orange-ink:#9c5a12;
  --ok:#1d7a4f; --ok-bg:#dff1e7; --bad:#b3261e; --bad-bg:#f9e0de; --na:#5f6b85; --na-bg:#e7ebf3;
  --tA:#0c5c8a; --tA-bg:#ddeefa; --tB:#6d28a8; --tB-bg:#efe3fa;
  --shadow:0 1px 3px rgba(11,28,71,.08),0 6px 18px rgba(11,28,71,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:10;background:linear-gradient(100deg,var(--navy),var(--navy-2));padding:12px 14px 0;border-bottom:3px solid var(--orange)}
.brand{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex:0 0 auto;text-decoration:none}
.logo svg{width:22px;height:22px;fill:#fff}
.brand h1{font-size:17px;font-weight:800;margin:0;color:var(--on-navy)}
.brand .sub{display:block;font-size:10.5px;font-weight:600;color:var(--on-navy-2);text-transform:uppercase;letter-spacing:.1em}
.brandright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tecklogo{height:24px;width:auto;display:block}
.adminline{font-size:9.5px;font-weight:600;color:var(--on-navy-2);letter-spacing:.05em;white-space:nowrap}
.tabs{display:flex;align-items:center;gap:10px;max-width:820px;margin:10px auto 0;flex-wrap:wrap}
.tabs a{color:var(--on-navy-2);text-decoration:none;font-size:14px;font-weight:700;padding:8px 2px 10px;border-bottom:3px solid transparent;margin-bottom:-3px}
.tabs a svg{width:14px;height:14px;fill:currentColor;vertical-align:-2px;margin-right:4px}
.tabs a.on{color:var(--on-navy);border-bottom-color:var(--orange)}
.tabs .slash{color:var(--on-navy-2);font-weight:300;font-size:17px}
#back{margin-left:auto;margin-bottom:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:var(--on-navy);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;cursor:pointer;display:none}

main{padding:14px;max-width:820px;margin:0 auto}
.dayhdr{font-size:19px;font-weight:800;margin:4px 2px 2px}
.daysub{font-size:13px;color:var(--ink-2);margin:0 2px 14px}
.hint{color:var(--ink-2);text-align:center;padding:40px 20px;font-size:15px}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.wcard .wn{font-weight:800;font-size:15px}
.wcard .wd{font-size:11px;color:var(--ink-3);margin-top:2px}
.wcard .wt{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;margin-top:6px;letter-spacing:.04em}
.wcard .wt.A{background:var(--tA-bg);color:var(--tA)}
.wcard .wt.B{background:var(--tB-bg);color:var(--tB)}
.wcard.now{border:2px solid var(--orange)}
.wcard.now .wn::after{content:' · ACTUAL';color:var(--orange);font-size:10px;letter-spacing:.05em}

.dcard{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.dcard .dn{font-weight:800;font-size:15px;min-width:96px}
.dcard .df{color:var(--ink-3);font-size:13px}
.dcard .dc{margin-left:auto}
.dcard.now{border:2px solid var(--orange)}
.hoytag{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--orange);background:var(--orange-soft);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.ring{font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px;white-space:nowrap}
.ring.p0{background:var(--na-bg);color:var(--na)}
.ring.part{background:var(--orange-soft);color:var(--orange-ink)}
.ring.done{background:var(--ok-bg);color:var(--ok)}

.fhdr{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.fhdr .tag{font-weight:800;font-size:17px}
.fhdr .fd{font-size:13.5px;color:var(--ink-2);margin:2px 0 10px}
.offlinetag{font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-bg);display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frow label{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.frow input{width:100%;padding:9px 10px;font-size:15px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:800;font-size:14.5px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .flecha{transition:transform .15s;color:var(--ink-3);font-size:12px}
details.sec[open]>summary .flecha{transform:rotate(90deg)}
details.sec>summary .badge{margin-left:auto}
.secarea{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.itemrow{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.itemrow .il{flex:1;min-width:150px;font-size:14px;font-weight:600}
.itemrow .il .isub{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.itemrow input.iv{width:110px;padding:9px 10px;font-size:16px;font-weight:700;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);text-align:right}
.itemrow input.iv.filled{border-color:var(--ok);background:var(--ok-bg)}
.itemrow .iu{font-size:12.5px;font-weight:700;color:var(--ink-3);min-width:34px}
.itemrow select.ie{padding:9px 6px;font-size:12.5px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink-2);max-width:118px}
.itemrow select.ie.set{border-color:var(--na);background:var(--na-bg);color:var(--na);font-weight:700}
.obsg{width:100%;min-height:70px;padding:10px;font-size:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit;margin-top:4px}
.grp{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);margin:16px 2px 8px}
.btnbar{display:flex;gap:8px;margin:14px 0 30px}
.btn{flex:1;padding:13px;border-radius:11px;border:0;font-weight:800;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0a1128}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink-2)}
.savemsg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.savemsg.show{opacity:.95}
.fab-save{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:40;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 30px;font-weight:800;font-size:15.5px;box-shadow:0 8px 24px rgba(11,28,71,.4);cursor:pointer;align-items:center;gap:9px}
.fab-save.show{display:flex}
:root[data-theme="dark"] .fab-save{color:#0a1128}
.fab-save.saved{background:var(--ok)}
.fabspacer{height:78px}
footer{padding:8px 14px 28px;text-align:center;font-size:11.5px;color:var(--ink-3)}

/* planilla semanal */
.plwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:6px}
table.pl{border-collapse:collapse;width:100%;font-size:11.5px;min-width:680px}
.pl th,.pl td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
.pl th{background:var(--accent-soft);color:var(--accent-ink);font-size:11px}
.pl td.eq{text-align:left;font-weight:600;max-width:210px;white-space:normal}
.pl td .u{color:var(--ink-3);font-size:10px}
.pl tr.sech td{background:var(--navy);color:#fff;text-align:left;font-weight:800;font-size:11px;letter-spacing:.03em}
.pl td.est{color:var(--na);font-style:italic;font-size:10.5px}
@media print{
  header,footer,.noprint,#listado,#form{display:none!important}
  body{background:#fff;color:#000}
  main{max-width:100%;padding:0}
  .plwrap{border:0;box-shadow:none;overflow:visible}
  table.pl{font-size:9px;min-width:0}
  .pl th,.pl td{border-color:#999;padding:2px 4px}
  .pl tr.sech td{background:#e8ecf5!important;color:#000!important;-webkit-print-color-adjust:exact}
}

/* kpis */
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow)}
.kpi .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.kpi.bad .v{color:var(--bad)}

/* tendencias */
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.titem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.titem:last-child{border-bottom:0}
.tinfo{flex:1;min-width:170px}
.tl{font-size:13.5px;font-weight:700}
.ts{font-size:11.5px;color:var(--ink-2)}
.tvals{display:flex;align-items:center;gap:8px;margin-left:auto}
.tv{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tv b{color:var(--ink);font-size:14px}

/* barra de navegación visible (pedido: el Volver del encabezado era muy camuflado) */
.navvolver{display:flex;gap:8px;margin:2px 0 14px;flex-wrap:wrap}
.bvolver{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.bvolver.cal{background:var(--accent-soft)}
.bvolver svg{width:15px;height:15px;fill:currentColor}
</style>
</head>

function goBack(){
  if(view.name==='registro') view={name:'dias',week:view.week};
  else if(view.name==='dias') view={name:'semanas'};
  else if(view.name==='planilla') view={name:'dias',week:view.week};
  else if(view.name==='tend') view={name:'semanas'};
  render();
}
$('#back').onclick=goBack;

function render(){
  $('#listado').innerHTML=''; $('#form').innerHTML=''; $('#planilla').innerHTML='';
  $('#fabsave').classList.remove('show');
  $('#back').style.display = view.name==='semanas' ? 'none':'inline-block';
  if(view.name==='semanas') renderSemanas();
  else if(view.name==='dias') renderDias();
  else if(view.name==='registro') renderRegistro();
  else if(view.name==='planilla') renderPlanilla();
  else if(view.name==='tend') renderTendencias();
  barraVolver();
  window.scrollTo(0,0);
}

function renderSemanas(){
  let cards='';
  for(let w=1;w<=52;w++){
    const t=(w%2===1)?'A':'B';
    const r=rangoSemana(w);
    cards+=`<button class="wcard ${w===SEMANA_ACTUAL?'now':''}" data-w="${w}">
      <div class="wn">Semana ${w}</div>
      <div class="wd">Jue ${fmt(r.ini)} – Mié ${fmt(r.fin)}</div>
      <span class="wt ${t}">TURNO ${t}</span>
    </button>`;
  }
  $('#listado').innerHTML=`
    <div class="dayhdr">Ruta crítica nocturna</div>
    <p class="daysub">Ronda de los nocheros por la planta: temperaturas y presiones de los <b>equipos críticos</b> (${NITEMS} puntos). Elige la semana — estás en la <b>Semana ${SEMANA_ACTUAL} · Turno ${SEMANA_ACTUAL%2===1?'A':'B'}</b>.</p>
    <div class="btnbar" style="margin-top:0"><button class="btn primary" id="vertend">📈 Tendencias de temperatura por equipo</button></div>
    <div class="wgrid">${cards}</div>`;
  document.querySelectorAll('.wcard').forEach(b=>b.onclick=()=>{ view={name:'dias',week:+b.dataset.w}; render(); });
  $('#vertend').onclick=()=>{ view={name:'tend'}; render(); };
}

function renderDias(){
  const w=view.week, t=(w%2===1)?'A':'B', r=rangoSemana(w);
  let body='';
  const hoyIso=iso(new Date());
  for(let di=0;di<7;di++){
    const fecha=fechaDia(w,di), f=iso(fecha);
    const n=progreso(f);
    const cls=n===0?'p0':(n>=NITEMS?'done':'part');
    const txt=n===0?'Sin registro':(n>=NITEMS?'Completa ✓':n+' / '+NITEMS);
    const esHoy=f===hoyIso;
    body+=`<button class="dcard ${esHoy?'now':''}" data-f="${f}">
      <span class="dn">${NOMBRES_DIA[di]}${esHoy?'<span class="hoytag">HOY</span>':''}</span><span class="df">${fmt(fecha)}</span>
      <span class="dc"><span class="ring ${cls}">${txt}</span></span>
    </button>`;
  }
  $('#listado').innerHTML=`
    <div class="dayhdr">Semana ${w} · Turno ${t}</div>
    <p class="daysub">Jueves ${fmt(r.ini)} al Miércoles ${fmt(r.fin)} · un registro por noche.</p>
    ${body}
    <div class="btnbar"><button class="btn ghost" id="verpl">📋 Ver planilla semanal (los 7 días)</button><button class="btn ghost" id="vertend2">📈 Tendencias</button></div>`;
  document.querySelectorAll('.dcard').forEach(b=>b.onclick=()=>{ view={name:'registro',week:w,f:b.dataset.f}; render(); });
  $('#verpl').onclick=()=>{ view={name:'planilla',week:w}; render(); };
  $('#vertend2').onclick=()=>{ view={name:'tend'}; render(); };
}

function renderRegistro(){
  const f=view.f, d=load(f);
  d.vals=d.vals||{};
  const fecha=new Date(f+'T12:00:00');
  /* dia de la semana por comparación de fechas exactas (con aritmética de ms
     el mediodía daba 4.5 días y Math.round lo corría al día siguiente) */
  let di=0; for(let k=0;k<7;k++){ if(iso(fechaDia(view.week,k))===f){ di=k; break; } }
  let secs='';
  RUTA.forEach((s,si)=>{
    let filas='';
    s.items.forEach(it=>{
      const [id,l,sub,u]=it;
      const stLoc=d.vals[id]||{};
      const stPrev=prevDe(f,id);
      const esPrev=!(String(stLoc.v||'').trim()||stLoc.e) && !!stPrev;
      const st=esPrev?stPrev:stLoc;
      const opts=['<option value="">—</option>'].concat(ESTADOS.map(e=>`<option value="${e}" ${st.e===e?'selected':''}>${e}</option>`)).join('');
      filas+=`<div class="itemrow">
        <span class="il">${esc(l)}${sub?`<span class="isub">${esc(sub)}</span>`:''}${esPrev?'<span class="isub" style="color:var(--ink-3)">(planilla)</span>':''}</span>
        <input class="iv ${String(st.v||'').trim()?'filled':''}" data-id="${id}" inputmode="decimal" value="${esc(st.v||'')}" placeholder="—">
        <span class="iu">${esc(u)}</span>
        <select class="ie ${st.e?'set':''}" data-id="${id}" aria-label="Estado">${opts}</select>
      </div>`;
    });
    const done=s.items.filter(it=>!!efectivoR(f,it[0],d.vals)).length;
    secs+=`<details class="sec" ${si===0?'open':''}>
      <summary><span class="flecha">▶</span> ${esc(s.sec)} <span class="secarea">${esc(s.area)}</span><span class="badge ring ${done===0?'p0':(done>=s.items.length?'done':'part')}" data-sec="${si}">${done}/${s.items.length}</span></summary>
      ${filas}
    </details>`;
  });
  $('#form').innerHTML=`
    <div class="fhdr">
      <div class="tag">🌙 Ronda ${NOMBRES_DIA[di]||''} ${fmt(fecha)}</div>
      <div class="fd">Ruta crítica nocturna · Semana ${view.week} · registra la temperatura/presión de cada punto, o marca su estado (detenido / stand by / sin acceso).</div>
      <div class="offlinetag">📴 Funciona sin internet — se guarda en este teléfono</div>
      <div class="frow">
        <div><label>Nochero 1</label><input id="rnoc" value="${esc(d.noc||'')}" placeholder="Nombre y apellido"></div>
        <div><label>Nochero 2 (opcional)</label><input id="rnoc2" value="${esc(d.noc2||'')}" placeholder="Nombre y apellido"></div>
        <div><label>Hora de la ronda</label><input id="rhora" type="time" value="${esc(d.hora||'')}"></div>
        <div><label>Avance</label><div class="ring ${progreso(f)===0?'p0':(progreso(f)>=NITEMS?'done':'part')}" id="ravance" style="display:inline-block;margin-top:6px">${progreso(f)} / ${NITEMS}</div></div>
      </div>
    </div>
    ${secs}
    <div class="grp">Observaciones de la ronda</div>
    <textarea class="obsg" id="robs" placeholder="Anomalías, ruidos, fugas, equipos con temperatura alta…">${esc(d.obs||'')}</textarea>
    <div class="btnbar">
      <button class="btn ghost" id="rborrar">Borrar registro</button>
    </div>
    <div class="fabspacer"></div>`;

  function recoger(){
    d.noc=$('#rnoc').value; d.noc2=$('#rnoc2').value; d.hora=$('#rhora').value; d.obs=$('#robs').value;
    document.querySelectorAll('input.iv').forEach(i=>{ d.vals[i.dataset.id]=d.vals[i.dataset.id]||{}; d.vals[i.dataset.id].v=i.value; });
    document.querySelectorAll('select.ie').forEach(s=>{ d.vals[s.dataset.id]=d.vals[s.dataset.id]||{}; d.vals[s.dataset.id].e=s.value; });
  }
  function refrescarBadges(){
    RUTA.forEach((s,si)=>{
      const done=s.items.filter(it=>!!efectivoR(f,it[0],d.vals)).length;
      const b=document.querySelector(`.badge[data-sec="${si}"]`);
      if(b){ b.textContent=done+'/'+s.items.length; b.className='badge ring '+(done===0?'p0':(done>=s.items.length?'done':'part')); }
    });
    const n=progreso(f), av=$('#ravance');
    if(av){ av.textContent=n+' / '+NITEMS; av.className='ring '+(n===0?'p0':(n>=NITEMS?'done':'part')); }
  }
  const persist=()=>{ recoger(); save(f,d); refrescarBadges(); };
  ['#rnoc','#rnoc2','#rhora','#robs'].forEach(s=>$(s).addEventListener('change',persist));
  document.querySelectorAll('input.iv').forEach(i=>i.addEventListener('change',e=>{ persist(); i.classList.toggle('filled',!!i.value.trim()); }));
  document.querySelectorAll('select.ie').forEach(s=>s.addEventListener('change',e=>{ persist(); s.classList.toggle('set',!!s.value); }));
  $('#rborrar').onclick=()=>{ if(confirm('¿Borrar todo el registro de esta noche?')){
    localStorage.removeItem(K(f));
    try{ if(cloudOk) cloudDb.collection('ruta').doc(f).delete().catch(()=>{}); }catch(e){}
    render(); } };

  const fab=$('#fabsave'); fab.classList.add('show');
  const fabtxt=fab.querySelector('.fabtxt'); fabtxt.textContent='Guardar ronda';
  fab.onclick=()=>{ recoger(); save(f,d); refrescarBadges(); fab.classList.add('saved'); fabtxt.textContent='✓ Guardada'; setTimeout(()=>{fab.classList.remove('saved'); fabtxt.textContent='Guardar ronda';},1500); };

  syncFromCloudIfNeeded(f).then(()=>{ if(view.name==='registro'&&view.f===f&&!datosLlenos(d)&&datosLlenos(load(f))) render(); });
}

async function renderPlanilla(){
  const w=view.week, r=rangoSemana(w);
  const fechas=[]; for(let di=0;di<7;di++) fechas.push(iso(fechaDia(w,di)));
  /* traer de la nube lo que falte localmente (solo lectura, sin pisar lo local) */
  if(cloudOk){ await Promise.all(fechas.map(f=>syncFromCloudIfNeeded(f))); }
  const datos=fechas.map(f=>load(f));
  const nocs=fechas.map((f,i)=>{const d=datos[i];return [d.noc,d.noc2].filter(Boolean).join(' / ');});
  let filas='';
  RUTA.forEach(s=>{
    filas+=`<tr class="sech"><td colspan="8">${esc(s.area)} — ${esc(s.sec)}</td></tr>`;
    s.items.forEach(it=>{
      const [id,l,sub,u]=it;
      let celdas='';
      datos.forEach((d,ix)=>{
        const st=efectivoR(fechas[ix],id,d.vals)||{};
        if(String(st.v||'').trim()) celdas+=`<td><b>${esc(st.v)}</b> <span class="u">${esc(u)}</span></td>`;
        else if(st.e) celdas+=`<td class="est">${esc(st.e)}</td>`;
        else celdas+='<td></td>';
      });
      filas+=`<tr><td class="eq">${esc(l)}${sub?` <span class="u">(${esc(sub)})</span>`:''}</td>${celdas}</tr>`;
    });
  });
  $('#planilla').innerHTML=`
    <div class="dayhdr">📋 Planilla semanal · Semana ${w}</div>
    <p class="daysub">Monitoreo de equipos críticos · Jueves ${fmt(r.ini)} al Miércoles ${fmt(r.fin)} · vista para revisar o imprimir (así se traspasa igual que la planilla Excel).</p>
    <div class="btnbar noprint"><button class="btn primary" id="plimp">🖨 Imprimir / PDF</button></div>
    <div class="plwrap"><table class="pl">
      <tr><th style="text-align:left">Equipo / Punto</th>${fechas.map((f,i)=>`<th>${NOMBRES_DIA[i].slice(0,3)}<br>${fmt(new Date(f+'T12:00:00'))}</th>`).join('')}</tr>
      <tr><td class="eq"><b>Nochero(s)</b></td>${nocs.map(n=>`<td style="font-size:10px">${esc(n)}</td>`).join('')}</tr>
      ${filas}
    </table></div>
    <div style="height:30px"></div>`;
  $('#plimp').onclick=()=>window.print();
}

function renderTendencias(){
  /* series por punto: historial de la planilla + lo digitado en la app */
  const map={};
  for(const f in RPREV){ const d=RPREV[f]; for(const id in d){ if(typeof d[id]==='number'){ (map[id]=map[id]||{})[f]=d[id]; } } }
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i); if(!k||!k.startsWith('ruta_')) continue;
    const f=k.slice(5); if(!/^\d{4}-\d{2}-\d{2}$/.test(f)) continue;
    let d; try{ d=JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }
    const vals=(d&&d.vals)||{};
    for(const id in vals){
      const v=parseFloat(String(vals[id].v||'').replace(',','.'));
      if(!isNaN(v)) (map[id]=map[id]||{})[f]=v;
    }
  }
  const META={};
  RUTA.forEach(s=>s.items.forEach(it=>{ META[it[0]]={l:it[1],sub:it[2],u:it[3],sec:s.sec,area:s.area}; }));
  const filas=[];
  let subidas=0,bajadas=0,conDatos=0;
  for(const id in map){
    const meta=META[id]; if(!meta||meta.u!=='°C') continue;
    const serie=Object.keys(map[id]).sort().map(f=>[f,map[id][f]]);
    if(serie.length<2) continue;
    conDatos++;
    const fUlt=serie[serie.length-1][0], vUlt=serie[serie.length-1][1];
    const vAnt=serie[serie.length-2][1];
    const prevs=serie.slice(-9,-1).map(x=>x[1]);
    const base=prevs.reduce((a,b)=>a+b,0)/prevs.length;
    const pct=base>0.5? (vUlt-base)/base*100 : 0;
    if(pct>=15) subidas++; else if(pct<=-15) bajadas++;
    filas.push({id,meta,serie,fUlt,vUlt,vAnt,base,pct});
  }
  filas.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
  const top=filas.slice(0,60);
  const fmtF=f=>f.slice(8,10)+'-'+f.slice(5,7);
  const spark=serie=>{
    const pts=serie.slice(-12).map(x=>x[1]);
    const mn=Math.min(...pts), mx=Math.max(...pts), rg=(mx-mn)||1;
    const xs=pts.map((v,i)=>[(i/((pts.length-1)||1))*96+2, 22-((v-mn)/rg)*18+1]);
    return '<svg viewBox="0 0 100 26" style="width:100px;height:26px;flex:0 0 auto"><polyline fill="none" stroke="var(--accent)" stroke-width="1.6" points="'+xs.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/><circle cx="'+xs[xs.length-1][0].toFixed(1)+'" cy="'+xs[xs.length-1][1].toFixed(1)+'" r="2.2" fill="var(--orange)"/></svg>';
  };
  let lista='';
  for(const x of top){
    const dirUp=x.pct>0;
    const chipStyle=Math.abs(x.pct)<8?'background:var(--na-bg);color:var(--na)':(dirUp?'background:var(--bad-bg);color:var(--bad)':'background:var(--tA-bg);color:var(--tA)');
    lista+=`<div class="titem">
      <div class="tinfo">
        <div class="tl">${esc(x.meta.l)}${x.meta.sub?' · '+esc(x.meta.sub):''}</div>
        <div class="ts">${esc(x.meta.sec)} <span style="color:var(--ink-3)">· últ. ${fmtF(x.fUlt)}</span></div>
      </div>
      ${spark(x.serie)}
      <div class="tvals"><span class="tv">prom ${x.base.toFixed(1).replace('.',',')} → últ <b>${String(x.vUlt).replace('.',',')}</b> °C</span>
      <span class="ring" style="${chipStyle}">${dirUp?'▲':'▼'} ${Math.abs(x.pct).toFixed(0)}%</span></div>
    </div>`;
  }
  $('#form').innerHTML=`
    <div class="dayhdr">\📈 Tendencias de temperatura · equipos críticos</div>
    <p class="daysub">Último valor de cada punto (planilla + rondas de la app) comparado con el promedio de sus lecturas anteriores. <span style="color:var(--bad);font-weight:700">▲ rojo = subiendo</span> · <span style="color:var(--tA);font-weight:700">▼ azul = bajando</span> — ordenado por mayor desviación.</p>
    <div class="kpis">
      <div class="kpi"><div class="v">${conDatos}</div><div class="l">Puntos con historial</div></div>
      <div class="kpi bad"><div class="v">${subidas}</div><div class="l">Subiendo ≥15%</div></div>
      <div class="kpi" style="border-color:var(--tA)"><div class="v" style="color:var(--tA)">${bajadas}</div><div class="l">Bajando ≥15%</div></div>
    </div>
    <div class="tlist">${lista||'<div class="hint">Aún no hay historial suficiente.</div>'}</div>
    ${filas.length>60?`<p class="daysub" style="text-align:center;margin-top:10px">Mostrando los 60 puntos con mayor desviación de ${filas.length} con historial.</p>`:''}
    <div style="height:30px"></div>`;
}

render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js')); }
</script>
